<!-- Descriptive prose: Krea2 and MOSS. The negative field shows only where the
     registry says has_negative - true on MOSS, false on Krea2. -->
<section class="builder" data-template="natural-language">
  <!-- In a format that writes a layout (MOSS Layout JSON) the Layout Studio
       sits beside this builder, and its Global prompt and medium are edited
       here, kept in step both ways; the Aspect sets its canvas. The brief stays
       the person's own: Generate writes the Global prompt, never the brief.
       data-layout-hide is not shown there, data-layout-only only there. See
       setupLayoutStudio. -->
  <label class="field">
    <span>Brief</span>
    <textarea data-bind="brief" rows="7"
      placeholder="Describe the scene as you would to someone drawing it without seeing it."></textarea>
  </label>

  <label class="field" data-layout-only hidden>
    <span>Global prompt <span class="field-optional">the scene inside the JSON — Generate writes it, edit freely</span></span>
    <textarea data-bind="layout_caption" rows="5"
      placeholder="Empty until you generate, or write the scene here yourself around boxes you drew."></textarea>
  </label>

  <div class="row layout-scene" data-layout-only hidden>
    <label class="field"><span>Medium / genre</span>
      <input type="text" data-bind="layout_meta" autocomplete="off" placeholder="illustration, poster, photo"></label>
    <div class="layout-rewrite">
      <button type="button" class="ghost" data-bind="layout_rewrite_scene"
        title="Rewrite the Global prompt with the whole layout as context">✧ Rewrite prompt</button>
      <button type="button" class="ghost" data-bind="layout_rewrite_all"
        title="Rewrite the Global prompt and every box">✧ Rewrite all</button>
    </div>
  </div>

  <div class="row">
    <!-- The prompt format, on a model that writes more than one (MOSS). The
         select holds the value Generate sends; what the person clicks is the
         FORMAT row at the top of the builder, which app.js builds from it.
         Hidden by class, not [hidden]: collectControls skips [hidden]. -->
    <label class="field format-source" data-show="modes"><span>Format</span>
      <select data-bind="mode"></select></label>
    <label class="field"><span>Style guidance</span>
      <select data-bind="style"></select></label>
    <label class="field"><span>Aspect</span>
      <select data-bind="aspect_ratio"></select></label>
    <!-- Details + Creativity. Rendered by renderSliders() in app.js from
         defaults.detail_levels and the model's creativity_presets, because
         both the notch count and the notch labels are config. -->
    <div class="sliders" data-bind="slider_block"></div>
  </div>

  <aside class="tips" data-bind="tips" data-layout-hide></aside>

  <!-- What Generate will do with the studio's canvas. Boxes drawn there go
       with Generate and are kept exactly; with none drawn, the generated
       layout is loaded into it. -->
  <div class="layout-studio-bar" data-bind="layout_studio" hidden>
    <span class="field-note" data-bind="studio_summary"></span>
  </div>

  <!-- The tag builder, identical to the booru template's. Tags are an INPUT
       here, not the output format: the LLM rewrites them into whatever
       dialect this model wants, so picking "purple_hair" from danbooru is
       useful even where the answer comes back as prose. That is why this is
       on every image model as of 22 Aug 2026, rather than only the tag ones.

       Nothing here is conditional on a model. tagForModel() already serves
       each one the spelling its registry entry asks for. -->
  <!-- Reference images, tagged on this machine and turned into instructions.
       The picture itself never leaves the box and never reaches the LLM —
       only what is written under it does, which is the same contract H3's
       references have carried since they were built.

       Each reference says three things a tag dump cannot: what the picture is
       FOR, how closely to follow it, and anything to take from it in
       particular. The same photograph is a character sheet, an outfit swatch
       or a lighting study depending on which of those you meant, and its tags
       read identically in all three cases. Vocabulary in config/models.yaml
       under defaults.image_reference_roles and defaults.reference_fidelity.

       Present in the three image templates and nowhere else. Its presence is
       the switch, exactly as reference_upload's is in video-h3.html; app.js
       returns early when the block is absent and names no model to decide it. -->
  <div class="imgref" data-bind="image_reference" data-layout-hide>
    <h4>Reference images <span class="field-optional">optional</span></h4>
    <div data-bind="imgref_list"></div>
    <template data-bind="imgref_row">
      <div class="imgref-card">
        <img data-bind="imgref_preview" alt="">
        <div class="imgref-body">
          <div class="row">
            <label class="field"><span>This picture is for</span>
              <select data-bind="imgref_role"></select></label>
            <label class="field"><span>How closely to follow it</span>
              <select data-bind="imgref_fidelity"></select></label>
          </div>
          <p class="field-note" data-bind="imgref_role_hint"></p>
          <label class="field" data-bind="imgref_character_field" hidden>
            <span>Character <span class="field-optional">searched in the tag catalog</span></span>
            <input type="text" data-bind="imgref_character" autocomplete="off" placeholder="Start typing a name…">
            <ul class="autocomplete" data-bind="imgref_character_suggestions" hidden></ul>
          </label>
          <label class="field" data-bind="imgref_applies_field" hidden>
            <span>Applies to</span>
            <select data-bind="imgref_applies"></select>
          </label>
          <label class="field">
            <span>What to take from it <span class="field-optional">optional, and it outranks everything else</span></span>
            <input type="text" data-bind="imgref_note" autocomplete="off">
          </label>
          <p class="trait-head">
            <span data-bind="imgref_title"></span>
            <button type="button" class="ghost" data-bind="imgref_analyze">Analyze</button>
            <button type="button" class="ghost" data-bind="imgref_add_all">Pick all</button>
            <button type="button" class="ghost" data-bind="imgref_remove">Remove</button>
          </p>
          <div class="pills" data-bind="imgref_chips"></div>
        </div>
      </div>
    </template>
    <!-- The same two selectors the cards carry, here so they exist before there is
         a card. Reported 27 Aug 2026: you could not choose what a picture was for
         until after uploading it, which is backwards - the role is what decides
         whether the tagger's output is worth reading at all. These set what the
         NEXT upload arrives as; each card still owns its own pair afterwards. -->
    <div class="row imgref-defaults">
      <label class="field"><span>This picture is for</span>
        <select data-bind="imgref_default_role"></select></label>
      <label class="field"><span>How closely to follow it</span>
        <select data-bind="imgref_default_fidelity"></select></label>
      <label class="field"><span>What you work from</span>
        <div class="seg" data-bind="imgref_mode">
          <button type="button" data-mode="analysis">Analysis</button>
          <button type="button" data-mode="tags">Tags</button>
        </div></label>
    </div>
    <input type="file" data-bind="imgref_upload" multiple>
    <p class="field-note" data-bind="imgref_status"></p>
  </div>

  <div class="tagbuilder" data-layout-hide>
    <input type="text" data-bind="tag_search" placeholder="Search tags..." autocomplete="off">
    <ul class="autocomplete" data-bind="tag_suggestions" hidden></ul>
    <p class="pills-head" data-bind="pills_head" hidden>
      <span data-bind="pills_count"></span>
      <button type="button" class="ghost" data-bind="clear_tags">Clear all</button>
    </p>
    <div class="pills" data-bind="tag_pills"></div>

    <!-- Appears when a character tag is picked. The model does not reliably
         know what a character looks like - measured, it put black hair on a
         redhead - so the traits come from danbooru and get clicked into the
         pills above rather than being guessed at generation time. -->
    <div class="traits" data-bind="trait_block" hidden>
      <p class="trait-head">
        <span data-bind="trait_title"></span>
        <button type="button" class="ghost" data-bind="trait_add_all">Add all</button>
      </p>
      <div class="pills" data-bind="trait_chips"></div>
    </div>
    <!-- Hidden on a model with no weight_range: Krea2 and MOSS are prose and
         ignore (tag:1.2), so the slider had no range to read and moved nothing. -->
    <label class="field weight" data-show="weight_range">
      <span>Weight <output data-bind="weight_value"></output></span>
      <input type="range" data-bind="weight">
    </label>
  </div>

  <!-- Anything that must survive into the positive prompt exactly as typed:
       a LoRA trigger word, an artist tag, a phrase that works. The brief is
       rewritten by the LLM; this is not. -->
  <label class="field" data-layout-hide>
    <span>Custom positive <span class="field-optional">kept verbatim</span></span>
    <textarea data-bind="positive" rows="2"
      placeholder="Trigger words, artist tags, anything that must appear as written."></textarea>
  </label>

  <label class="field" data-show="has_negative">
    <span>Negative prompt</span>
    <textarea data-bind="negative" rows="2"></textarea>
  </label>

  <button type="button" data-bind="generate"></button>

  <!-- Layout JSON has no Output panel (the studio shows the JSON), so the
       progress, any error with its Retry, and the negative prompt land here. -->
  <div class="layout-status" data-bind="layout_status" data-layout-only hidden></div>
</section>
