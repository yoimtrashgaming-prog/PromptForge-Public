    # the owner's to correct.
    #
    # Deliberately short. The catalogue's own advice is that "selecting a small
    # set of coherent terms is usually better than copying an entire category",
    # and Anima trained with random tag dropout, so three or four
    # high-information tags beat a wall of synonyms.
    #
    # "None" stays an empty list — server.mjs special-cases it to inject no
    # Style line at all, the same idea as the None quality preset.
    #
    # Two carry caveats the catalogue itself raises. "Realistic" fights this
    # checkpoint: the model card says Anima is built for anime and
    # non-photographic illustration, and photorealistic "does not turn Anima
    # into a specialized photography model" — it is offered, it will pull less
    # cleanly. "Chibi" is the one entry with NO catalogue source; it is a plain
    # Danbooru tag and anima.md's own weighting example reaches for (chibi:2).
    styles:
      "Painterly":          ["painterly", "painterly brushstrokes", "smooth gradients", "soft shading"]
      "Anime":              ["anime coloring", "cel shading", "clean lineart", "vibrant colors"]
      "Cel shaded":         ["cel shading", "hard cel shading", "anime coloring", "clean lineart"]
      "Flat color":         ["flat color", "anime coloring", "clean lineart"]
      "Lineless":           ["no lineart", "lineless", "painterly", "soft shading", "smooth gradients"]
      "Soft painting":      ["painterly", "soft shading", "smooth gradients", "soft lines"]
      "Watercolor":         ['watercolor \(medium\)', "traditional media", "soft edges"]
      "Gouache":            ['gouache \(medium\)', "traditional media", "painterly brushstrokes"]
      "Sketch":             ["sketch", "unfinished", 'graphite \(medium\)', "loose brushwork"]
      "Ink lineart":        ["lineart", 'ink \(medium\)', "clean lineart", "sharp lines"]
      "Manga":              ["monochrome", "greyscale", "screentones", "halftone", "lineart"]
      "Chibi":              ["chibi"]
      "Pixel art":          ["pixel art"]
      "90s anime":          ["retro artstyle", "anime screencap", "flat color"]
      "Concept art":        ["concept art", "key visual", "painterly", "detailed background"]
      "Cinematic lighting": ["cinematic lighting", "dramatic lighting", "rim lighting", "volumetric lighting"]
      "Semi-realistic":     ["semi-realistic", "realistic anatomy", "detailed skin texture", "natural skin tones", "subsurface scattering"]
      "Realistic":          ["realistic", "realistic anatomy", "detailed skin texture", "realistic lighting"]
      "None":               []
    default_style: "None"
    # Twenty tags until 2 Sep 2026, six of them Pony ladder and SD-era
    # crutches. Cut on the owner's call, following circlestone-labs'
    # community prompting guide (civitai article 30800): Anima is DiT, not
    # SDXL, "the negative prompt is significantly weaker because the
    # transformer itself maintains anatomy and frame logic with an iron grip.
    # By pasting giant walls of text there, you are simply clogging the
    # encoder's context window ... In extreme scenarios, just use a lean
    # safety net: bad hands, bad fingers."
    negative_defaults: "bad hands, bad fingers"
    # How many tags the model may add on top of negative_defaults.
    #
    # The global floor in config/server.yaml is `extra_max: 0`, which means
    # capExtras deleted EVERYTHING the model wrote and shipped the two default
    # tags alone. Observed 3 Sep 2026: a Frieren brief streamed a 23-tag
    # negative into the panel and the finished result was "bad fingers, bad
    # hands" — the owner's call was that the longer one was the better output,
    # so the model was doing useful work that the server then threw away.
    #
    # 24 is sized to that observation: ~21 tags past the defaults, with room.
    # It bounds rather than removes — the 1,652-character negative that made
    # capExtras necessary is still cut. Note this is anima only; every other
    # model still inherits the global 0 and still loses its whole negative.
    negative_extra_max: 24
    # Render from PromptForge. See the note on illustrious.
    render:
      workflow: "config/comfyui/anima.json"
      ui_workflow: "config/comfyui/ui/anima.json"
      presets:
        - { name: "Anima · 40 steps · CFG 3.5", steps: 40, cfg: 3.5, sampler: "er_sde", scheduler: "simple" }
      # A guess: no Anima LoRA on the box yet to read. Fix it from the app.
      lora_match: ["anima"]

  krea2:
    name: "Krea2"
    label: "Krea2"
    type: "image"
    template: "natural-language"
    badge: "nl"
    format_label: "Natural language format"
    gen_button: "Enhance prompt"
    system_prompt: "prompts/image/krea2-min.md"
    # One file per switchable segment, appended only when it is asked for.
    # The base file above is how this model THINKS; these are what each
    # segment is. See the note on illustrious for the whole argument.
    segment_blocks:
      "What changed": "prompts/image/segments/krea2-what-changed.md"
    thinking: false
    segments: ["Enhanced prompt", "What changed"]
    meta_segments: ["What changed"]
    # krea2.md: "there is no negative prompt segment" — the template must
    # not render a negative field for this model.
    has_negative: false
    # Raised from 60-150 on 26 Aug 2026 with the image prompt overhaul. Both
    # files now say the same thing: these are Flux-family models that follow
    # long prompts accurately, so the old ceiling was capping the one thing
    # they are good at. Not enforced anywhere — it feeds the tips line and
    # seeds the manual length control, which is the real override.
    word_target: { min: 80, max: 250 }
    # Styles are pasted onto the end of the prompt word for word, in code, not
    # handed to the LLM to rewrite. The owner's call, 18 Oct 2026: Krea2 reads
    # a style at the end, and these blocks were tested as written. The LLM
    # still sees the block, so the scene agrees with it. See server/style.mjs.
    style_placement: "append"
    # Each value is ONE block of prose, the exact text that is pasted.
    #
    # Most of these are a user's, from his Krea2 style catalogue
    # (Catalogue_styles_Krea2.html, 27 tests, each with the render it made):
    # tested, so his replace every one of the older descriptor lists he
    # covers. **His wording, unchanged, except for words that described his
    # test CHARACTER** rather than the style - on the owner's call, 18 Oct
    # 2026: "his prompts are tested, don't cut that". The only cuts:
    # "heterochromatic eyes" (Concept Art), "delicate red and blue eye
    # accents" (Colored Pencils), "melancholic aristocratic young woman"
    # (Dark Romanticism), "graceful feminine silhouette" (Art Nouveau),
    # "lightning symbols" (Psychedelic Character) and "optionally crossed
    # by / accents of subtle electric energy" (both Shattered Mirrors).
    # "gothic", "portrait", the palettes and the Japanese settings are his
    # style and stay. His tests 19 and 20 are the same block on two poses,
    # so they are one entry here.
    #
    # Photorealistic, Realistic CGI, Video game render and the ones after his
    # are not his - the looks his catalogue does not have, carried over from
    # the old list or added on the owner's ask (CGI, video game), written in
    # his register. Untested on renders.
    styles:
      "Photorealistic": "Photorealistic photograph, natural skin texture with visible pores and fine detail, realistic light falloff, natural colour, true-to-life materials and fabrics, shallow depth of field, shot on a full-frame camera with a fast prime lens."
      "Realistic CGI": "High-end realistic CGI render, physically based materials, ray-traced lighting with soft global illumination, subtle subsurface scattering on skin, finely modelled hair and fabric, crisp clean detail, cinematic composition, polished studio-quality 3D artwork, like a frame from a feature-film animation or a premium cinematic trailer."
      "Video game render": "Modern video game render, real-time game engine graphics, stylized-realistic PBR textures, sharp normal-mapped detail on clothing, armor and props, dramatic in-engine lighting with rim light, bloom and ambient occlusion, clean readable silhouettes, polished AAA game key art, like an in-game cinematic screenshot."
      "Traditional Watercolor": "Traditional watercolor illustration, hand-painted on textured paper. Soft, slightly desaturated colors, translucent pigments, delicate washes and visible layers of paint. Fine, flowing, partly softened outlines, with areas where colors naturally bleed into the paper. Gentle shadows, refined details around the face and eyes, and a looser, more abstract background. Small brushwork irregularities, wet edges, subtle splashes and a handcrafted texture. An elegant, poetic, slightly gothic atmosphere, like an artist-painted storybook illustration."
      "Watercolor and Gouache": "Watercolor and gouache painting, layered pigments, expressive visible brushstrokes, soft painterly edges, detailed face, textured paper, rich but muted colors, elegant gothic storybook illustration."
      "Rough Pencil Sketch": "Rough pencil sketch, visible raw linework, messy expressive strokes, imperfect contours, cross-hatching, scribbled shading, sketchbook drawing, unfinished hand-drawn look, traditional paper texture, organic and lively artistic sketch."
      "Expressive Charcoal — A": "Charcoal illustration, hand-drawn on textured paper with dark, raw, expressive strokes. Irregular lines, partly smudged contours, deep shadows and broad areas of black created by rubbing charcoal across the paper. Visible dust, smears, heavy hatching and finger or blending marks create a lively, dramatic, organic appearance. The drawing retains a sketchy, artistic finish, with strong contrasts between the light paper and dark charcoal masses. An elegant, melancholic, slightly gothic atmosphere, like a traditional artist’s study in a sketchbook or on a studio drawing sheet."
      "Expressive Charcoal — B": "Charcoal sketch, dark expressive strokes, smudged shading, rough hand-drawn linework, deep shadows, heavy contrast, visible charcoal dust, textured paper, organic unfinished look, dramatic traditional drawing, slightly gothic atmosphere."
      "Chinese Ink": "Traditional Chinese ink drawing, expressive black ink strokes, flowing linework, deep blacks, dry-brush textures, subtle ink splashes, textured rice paper, elegant gothic portrait, delicate facial details."
      "Victorian Engraving": "Victorian engraved illustration, intricate cross-hatching, fine etched lines, antique book illustration, monochrome ink, dramatic shadows, aged paper texture, elegant gothic atmosphere."
      "Soft Pastel": "Traditional soft pastel portrait, powdery pigments, visible pastel strokes, gently smudged edges, textured paper, muted colors, delicate highlights, elegant and dreamy atmosphere."
      "Classical Oil Painting": "Classical oil painting portrait, visible layered brushstrokes, rich fabric textures, soft natural skin, dramatic chiaroscuro lighting, dark elegant background, aristocratic gothic atmosphere, museum-quality painting."
      "Editorial Gouache": "Hand-painted gouache illustration, opaque matte pigments, simplified elegant shapes, visible brushwork, muted sophisticated palette, vintage editorial illustration, refined gothic character design."
      "Art Nouveau": "Art Nouveau portrait illustration, elegant flowing lines, ornamental floral frame, black and golden decorative motifs, symmetrical poster composition, muted jewel tones, intricate handcrafted details."
      "Traditional Ink Manga": "Traditional ink manga illustration, expressive pen linework, rough cross-hatching, hand-drawn screentone shading, detailed eyes and hair, black-and-white comic artwork, visible paper texture."
      "Painterly Concept Art": "Painterly character concept art, highly detailed face, loose unfinished brushstrokes around the clothing and background, visible construction lines, expressive edges, elegant dark fantasy design."
      "Gothic Stained Glass": "Gothic stained-glass portrait, bold black lead outlines, luminous translucent glass, deep red and blue accents, ornate cathedral patterns, symmetrical decorative composition, mystical colored light."
      "Vintage Lithography": "Vintage lithographic portrait, grainy black ink textures, greasy crayon marks, rough tonal shading, imperfect printing, aged paper, dark romantic gothic mood, expressive handmade appearance."
      "Colored Pencils": "Colored pencil portrait on toned paper, visible layered pencil strokes, white pencil highlights, soft cross-hatching, refined sketchbook illustration, subtle muted colors."
      "Dark Romanticism": "Dark romantic painting, atmospheric shadows, soft painterly edges, restrained colors, dramatic cloudy background, poetic gothic elegance, subtle supernatural mood."
      "Geometric Collage": "Stylized illustration built from simple assembled color shapes, like a geometric collage. The image is fragmented into multiple flat areas with clean edges, made of colored pieces fitting together to form the subject. Volume is suggested through the juxtaposition of flat shapes rather than realistic rendering. Little to no gradients, very simplified shading, and a clear organized color palette. Graphic, modern, decorative look, somewhere between paper cut-out, mosaic, and simplified cubism."
      "Psychedelic Poster": "Hand-drawn psychedelic illustration inspired by 1960s and 1970s counterculture posters. Dense composition filled with flowing organic shapes, swirling ornamental patterns, flames, waves, curls, and floral motifs. Thick, uneven black outlines surround every element. Highly saturated flat colors such as turquoise, purple, orange, red, yellow, and green, with almost no realistic shading. Hair, clothing, and background merge into intricate decorative patterns. Elongated and slightly distorted proportions, surreal mystical imagery, maximalist visual density, vintage screen-print texture, imperfect handmade linework, aged paper appearance, acid-rock poster atmosphere, eccentric and slightly gothic mood."
      "Psychedelic Character": "Vibrant 1960s–1970s psychedelic poster aesthetic applied to the entire character, not merely the background. Hair becomes flowing colored ribbons, spirals and ornamental waves. Clothing is reconstructed from bold flat color shapes, curved patterns, flowers and swirling organic motifs. Thick, slightly irregular black outlines, simplified graphic shadows and saturated poster colors. Dense maximalist composition, almost no empty space, hand-drawn linework, vintage screen-print texture, aged cream paper, Japanese waves mixed with psychedelic flames, flowers and spirals."
      "Shattered Mirrors — A": "Illustration seen through a multitude of mirror fragments. The image is divided into many glass shards or irregular mirror panels, each reflecting a different part of the subject. Some facets show almost the entire portrait, while others capture only an eye, a hand, a strand of hair or a piece of clothing. The composition should feel like a kaleidoscope or a shattered mirror, with varied angles, visual repetition and subtle distortions in the reflections. The mirrors catch the light, creating bright reflections, glints and luminous edges. The subject’s identity must remain immediately recognizable, while the image repeats and fragments throughout the scene. An elegant, mysterious, slightly dramatic atmosphere, with purple, blue and silver tones."
      "Shattered Mirrors — B": "Portrait reflected in a multitude of mirror shards. The entire image is split into many irregular mirror fragments or broken glass panels, each reflecting a different part of the subject. Some mirror pieces show nearly the full portrait, while others only capture one eye, a hand, a strand of hair, or a small section of the costume. The composition should feel like a kaleidoscope or a shattered mirror, with varied angles, repeated reflections, and subtle distortions across the glass surfaces. Bright highlights, silver reflections, and sparkling edges should emphasize the mirror material. The subject must remain clearly recognizable, but the image is multiplied and fragmented throughout the scene. Elegant, mysterious, slightly dramatic mood, with purple, blue, and silver tones."
      "Ground Pebble Mosaic": "A flat ground pebble mosaic fully integrated into a Japanese-inspired garden. The portrait is reconstructed entirely from many smooth colored pebbles, with each pebble forming part of the face, hair, clothing, and ornaments. The mosaic lies flat on the garden floor, embedded into a bed of small dark stones and pebbles, surrounded by moss, smooth rocks, low plants, delicate grasses, and purple flowers. Serene Japanese garden atmosphere, bamboo water feature, stone lanterns, scattered sakura petals, subtle purple glow, ornamental stones, and a refined mystical mood. The subject exists entirely as the pebble mosaic itself, not as a person or an upright sculpture."
      "Modular Origami": "Portrait recreated entirely as a modular origami artwork, built from hundreds of folded paper pieces assembled together to form the face, hair, eyes, clothing and ornaments. The entire character is made of folded paper modules. Elegant Japanese handcrafted aesthetic, highly detailed paper texture, layered folded geometry, refined composition, soft lighting, sophisticated atmosphere."
      "Shadow Installation": "An artistic shadow installation inspired by a Japanese aesthetic. Paper lanterns, folding fans, branches, cords, charms, flowers, wooden pieces, ribbons, and ornamental elements are arranged in space. The objects look scattered and sculptural, but the shadow they cast on the ground or wall forms a clear and recognizable portrait. The subject’s defining silhouette and ornaments are visible in the shadow. Poetic, clever, magical composition, strong dramatic lighting, elegant Japanese atmosphere, conceptual artwork."
      "Glowing Lantern Portrait": "A large-scale night installation viewed directly from above. Hundreds of individual glowing paper lanterns are carefully arranged across the ground to collectively form a recognizable portrait. The subject exists only through the placement, color, density, and light of the separate lanterns, with no solid body or conventionally drawn character. Colored lanterns reconstruct the face, hair, eyes, clothing and ornaments. Every lantern remains individually visible, with small spaces between them. Viewed up close, the scene is only an arrangement of lanterns; viewed from above and at a distance, the lights resolve into a portrait. Dark Japanese-inspired festival garden at night, stone paths, sakura trees, shrine architecture, subtle purple illumination, and a magical ceremonial atmosphere."
      "Digital art": "Digital painting, clean polished rendering, controlled color palette, crisp edges, smooth blended shading, refined detail where the eye lands, modern digital illustration finish."
      "Cinematic": "Cinematic film still, dramatic key light with a defined rim light, soft volumetric haze, deep but readable shadows, natural film colour grade, widescreen framing, shallow depth of field, like a frame from a feature film."
      "Anime": "Anime illustration, clean confident linework, cel-shaded colour with crisp shadow shapes, saturated but controlled palette, expressive eyes, polished key-visual finish."
      "Cel shaded": "Cel-shaded illustration, hard-edged shadows, flat blocks of color, clean even linework, two-tone shading, bright graphic finish."
      "Flat color": "Flat color illustration, no gradients, solid blocks of color, clean linework, bold graphic shapes, simplified shading, modern poster finish."
      "Lineless": "Lineless illustration, no outlines, forms defined by color alone, soft shading, smooth gradients, gentle painterly edges."
      "Chibi": "Chibi illustration, oversized head on a small rounded body, simplified features, big expressive eyes, clean linework, soft flat colour, cute and playful finish."
      "Pixel art": "Pixel art, limited colour palette, visible pixel grid, hard aliased edges, simple dithered shading, retro 16-bit game sprite look."
      "90s anime": "1990s anime cel illustration, retro hand-painted cel look, flat cel color with hard shadows, slightly muted vintage palette, soft film grain, like a frame from a 90s anime broadcast."
      "Semi-realistic": "Semi-realistic illustration, realistic anatomy with slightly stylized proportions, detailed skin texture, painterly rendering, soft natural lighting, refined detail on the face and hands."
      "None": ""
    default_style: "None"
    # Render from PromptForge. See the note on illustrious. Turbo and Raw are
    # two files of one model, so each preset names its own.
    render:
      workflow: "config/comfyui/krea2.json"
      ui_workflow: "config/comfyui/ui/krea2.json"
      presets:
        - { name: "Turbo · 8 steps · CFG 1", steps: 8, cfg: 1, sampler: "euler", scheduler: "simple", model_file: "krea2_turbo_fp8_scaled.safetensors" }
        - { name: "Raw · 50 steps · CFG 3.5", steps: 50, cfg: 3.5, sampler: "euler", scheduler: "simple", model_file: "krea2_raw_fp8_scaled.safetensors" }
      # A guess, like anima's: no Krea2 LoRA on the box yet to read.
      lora_match: ["krea"]

  # MOSS-Image (OpenMOSS), added 18 Oct 2026 at the owner's ask. It reads
  # prose, tags and a JSON layout, alone or combined, so it emits both: the
  # prose prompt and the layout for the same picture. A user built a layout
  # editor for it (MOSS Layout Studio); this follows the same format, which is
  # the one in the makers' guide.
  moss:
    name: "MOSS"
    label: "MOSS-Image"
    type: "image"
    template: "natural-language"
    badge: "nl"
    format_label: "Natural language · hybrid · layout JSON"
    gen_button: "Generate prompt"
    system_prompt: "prompts/image/moss.md"
    # The makers' guide, then a user's own worked layout and rules from MOSS
    # Layout Studio. Both load ahead of moss.md.
    reference_files: ["prompts/image/references/moss-official.md", "prompts/image/references/moss-layout-studio.md"]
    # The Layout Studio's Rewrite and Rewrite all: the studio's own instruction,
    # served by POST /api/moss/assist instead of its bundled Qwen engine.
    layout_rewrite_prompt: "prompts/image/moss-rewrite.md"
    segment_blocks:
      "Layout JSON": "prompts/image/segments/moss-layout.md"
      "Negative prompt": "prompts/image/segments/moss-negative.md"
      "What changed": "prompts/image/segments/moss-what-changed.md"
    thinking: false
    # MOSS reads three formats, and the person picks one (a user's report,
    # 18 Oct 2026: there was only the layout one, and no way to turn the
    # Layout Studio off). The layout segment, its Canvas line and the studio
    # exist only in "Layout JSON". Hybrid is a tag line in the makers' order
    # with the prose after it, named by the user who has used MOSS most.
    modes: ["Natural language", "Hybrid", "Layout JSON"]
    default_mode: "Natural language"
    segments: ["Enhanced prompt", "Layout JSON", "Negative prompt", "What changed"]
    segments_by_mode:
      "Natural language": ["Enhanced prompt", "Negative prompt", "What changed"]
      "Hybrid": ["Enhanced prompt", "Negative prompt", "What changed"]
      # The JSON alone, 19 Oct 2026 (owner): summary.caption IS the prose, so
      # a separate prose segment said everything twice, and the Layout Studio
      # shows the JSON, so there is no Output panel for notes to land in.
      "Layout JSON": ["Layout JSON", "Negative prompt"]
    # Every format listed, the two without a file as []: a format left out
    # falls back to every format's file, and would be told to write tags.
    mode_blocks:
      "Natural language": []
      "Hybrid": ["prompts/image/modes/moss-hybrid.md"]
      "Layout JSON": []
    meta_segments: ["What changed"]
    has_negative: true
    # The guide's tested negative minus its leading `nsfw`, which would
    # quietly work against every NSFW brief this group writes. Owner's call
    # whether it goes back in.
    negative_defaults: "worst quality, bad anatomy, watermark, jpeg artifact"
    word_target: { min: 80, max: 250 }
    # The layout's boxes are absolute pixels with the origin at the centre, so
    # they belong to one output size — and the JSON does not carry it. Each
    # aspect maps to the size the boxes are measured on: about 1M pixels (the
    # guide's lowest recommendation), both sides multiples of 16, ratio exact.
    # N/A is square. server/layout.mjs reads this; the tips line shows it so
    # the same size can be set in ComfyUI.
    layout_canvas:
      "N/A":           [1024, 1024]
      "1:1 Square":    [1024, 1024]
      "2:3 Portrait":  [832, 1248]
      "3:2 Landscape": [1248, 832]
      "3:4 Portrait":  [864, 1152]
      "4:3 Landscape": [1152, 864]
      "9:16 Tall":     [864, 1536]
      "16:9 Wide":     [1536, 864]
    # Krea2's descriptor set: prose looks, which is what this model reads too.
    styles:
      "Photorealistic":  ["photorealistic", "natural skin texture", "realistic light falloff", "shallow depth of field"]
      "Digital art":     ["digital painting", "clean rendering", "controlled color palette", "crisp edges"]
      "Painterly":       ["painterly brushwork", "visible brush strokes", "soft gradients", "blended edges"]
      "Cinematic":       ["cinematic lighting", "dramatic key light", "rim light", "volumetric haze", "widescreen framing"]
      "Anime":           ["anime illustration", "cel-shaded color", "clean linework", "saturated palette"]
      "Cel shaded":      ["cel shading", "hard-edged shadows", "flat blocks of color", "clean linework"]
      "Flat color":      ["flat color", "no gradients", "clean linework", "graphic shapes"]
      "Lineless":        ["no outlines", "forms defined by color alone", "soft shading", "smooth gradients"]
      "Soft painting":   ["soft painterly rendering", "diffuse shading", "smooth gradients", "gentle edges"]
      "Watercolor":      ["watercolor", "paper texture", "bleeding pigment", "soft edges", "visible washes"]
      "Gouache":         ["gouache", "matte opaque paint", "visible brush strokes", "flat rich color"]
      "Sketch":          ["pencil sketch", "graphite", "loose construction lines", "unfinished", "paper texture"]
      "Ink lineart":     ["ink drawing", "black linework", "sharp confident lines", "hatching for shadow"]
      "Manga":           ["black and white manga", "screentone shading", "halftone dots", "inked linework"]
      "Chibi":           ["chibi proportions", "oversized head", "small rounded body", "simplified features"]
      "Pixel art":       ["pixel art", "limited palette", "visible pixel grid", "hard aliased edges"]
      "90s anime":       ["1990s anime cel", "retro anime look", "flat cel color", "film grain"]
      "Concept art":     ["concept art", "key visual", "painterly rendering", "detailed environment"]
      "Semi-realistic":  ["semi-realistic rendering", "realistic anatomy", "detailed skin texture", "stylized proportions"]
      "None":            []
    default_style: "None"


  # ─────────────────────────── VIDEO ───────────────────────────

  h3:
    name: "MiniMax H3"
    label: "MiniMax H3"
    type: "video"
    template: "video-h3"
    # Opted out of the lighting slider, 8 Sep 2026. It is an image-model
    # control for now: a clip can change its exposure from shot to shot, and
    # one scalar for the whole thing is the wrong shape of control here.
    # Delete this line to switch it on for this model.
    lighting_levels: {}
    badge: "video"
    format_label: "Structured shot format"
    gen_button: "Generate H3 prompt"
    # The Director node's Simple prompt mode, 14 Sep 2026. Simple is one text
    # box sent to H3 verbatim, so it has to carry the alignment line and the
    # field names that Structured mode adds itself. server/h3-simple.mjs
    # assembles that from the same segments in code; the model is asked for
    # nothing different. The Structured / Simple switch in the Director
    # toolbar picks which one the output panel shows and copies.
    simple_prompt: true
    # Where to get a ComfyUI workflow that consumes this prompt (owner's call,
    # 4 Oct 2026). It is not ours to ship, so the builder links to the
    # author's own page instead. This is the one deliberate exception to "the
    # UI never sends anyone off the tailnet"; the link says where it goes.
    comfyui_workflow:
      label: "Get the workflow"
      title: "The DaSiWa MiniMax H3 workflows for ComfyUI, on Civitai (opens Civitai)"
      url: "https://civitai.com/models/2831978"
    # A score only when the brief asks for music (owner's rule, 1 Oct 2026).
    # SKILL.md says it; server/music.mjs enforces it, because the 4B wrote a
    # score 4/4 times without being asked. Delete the line to let the model
    # decide again.
    music_only_when_asked: true
    system_prompt: "prompts/video/h3/SKILL.md"
    # One file per switchable segment, appended only when it is asked for.
    # The base file above is how this model THINKS; these are what each
    # segment is. See the note on illustrious for the whole argument.
    segment_blocks:
      "Reasoning": "prompts/video/segments/h3-reasoning.md"
    # The contract depends on the mode, 10 Sep 2026. The base modes have three
    # official fields and REF2VA has six, and until today every mode was asked
    # for all seven segments and told to write N/A in the three it does not
    # have - a paragraph of instructions about segments that do not exist, in
    # every base-mode prompt. Now a base mode is simply not asked for them.
    #
    # Any mode not listed here - REF2VA, and Auto detect should it ever reach
    # the prompt unresolved - keeps `segments` above, all seven. A leftover
    # REF2VA segment written in a base mode is allowed and dropped, never an
    # unknown_segment failure: see segmentsOutsideMode in server/director.mjs.
    segments_by_mode:
      "T2VA":  ["Detailed description", "Soundscape", "Music", "Reasoning"]
      "I2VA":  ["Detailed description", "Soundscape", "Music", "Reasoning"]
      "FL2VA": ["Detailed description", "Soundscape", "Music", "Reasoning"]
      "L2VA":  ["Detailed description", "Soundscape", "Music", "Reasoning"]
      # Picture labels, 30 Sep 2026: REF2VA where the person labelled each picture.
      # Code writes Retention analysis from the shots, and Subject definitions
      # from the scans plus the model's one acting line per character, so the
      # model is not asked for Retention at all. A key, not a mode: nothing in
      # `modes` offers it; server/picture-labels.mjs promptMode() picks it.
      "REF2VA labelled": ["Subject definitions", "Summary", "Detailed description", "Soundscape", "Music", "Reasoning"]
    # The part of the prompt that belongs to one mode alone, composed AFTER
    # SKILL.md so the mode gets the last word. SKILL.md is what holds in every
    # mode; before this split it carried REF2VA's reference roles, its three
    # extra sections and a REF2VA-shaped worked example into every base-mode
    # generation - about 5,000 characters no base mode could use.
    #
    # Same fallback rule as reference_files_by_mode: a mode with no entry, or a
    # request with no mode, composes every block, never none.
    mode_blocks:
      "REF2VA": ["prompts/video/h3/modes/ref2va.md"]
      "REF2VA labelled": ["prompts/video/h3/modes/ref2va-labelled.md"]
      "Auto detect":
        - "prompts/video/h3/modes/base.md"
        - "prompts/video/h3/modes/ref2va.md"
      "T2VA":  ["prompts/video/h3/modes/base.md"]
      "I2VA":  ["prompts/video/h3/modes/base.md"]
      "FL2VA": ["prompts/video/h3/modes/base.md"]
      "L2VA":  ["prompts/video/h3/modes/base.md"]

    # h3 is the only model that needs a bigger LLM than llm.model.
    #
    # Measured 21 Aug, dialect suite at --runs 3 on qwen3:8b: nine of ten
    # models clean, h3 8/10 DEGRADED. It fails base-mode discipline
    # specifically — SKILL.md says base modes write N/A for Subject
    # definitions and Retention analysis, and the 8B fills them in anyway.
    # No surprise: this is the largest prompt in the project at ~56,100
    # characters, seven segments, two official MiniMax guides.
    #
    # COST, on a 16GB card: the 8B and the 27B cannot both be resident, so
    # every switch between h3 and any other tab pays a full model load. If
    # that thrash is worse than the degradation, delete this line — nine
    # models keep working either way.
    # A SOFT default, not a hard pin. The selector stays unlocked so people can
    # pick any model for h3 and live with it - measured, the smaller models fail
    # h3's base-mode discipline ~8 times in 10, which is why this default exists.
    # Overridden by a per-user prompt_llm choice. Use llm_model instead of this
    # to forbid overriding (that hard-pin path is still in the code).
    #
    # The pin itself moved to llm.model_defaults in server.yaml on 20 Sep 2026:
    # it named a llama-swap entry only the P40 has, so on any other install h3
    # asked for a model that did not exist. The P40 sets
    #   llm: { model_defaults: { h3: "hf.co/unsloth/Qwen3.8-27B-GGUF:UD-Q3_K_XL" } }
    # in its server.local.yaml; everywhere else h3 uses the global default.
    # h3 sends the largest system prompt in the app: 56,100 characters with
    # the two official MiniMax guides, which tokenises to 13,188 BEFORE it
    # writes anything. Below ~14k it cannot accept its own prompt and every
    # generation returns HTTP 400 exceed_context_size_error - measured on the
    # P40, 23 Aug 2026, where the deployment context of 12288 did exactly
    # that. 16384 leaves room for max_output_chars on top.
    #
    # Per-model rather than raising llm.context_length, because this is a
    # property of h3 on any box, and the other nine models run on a smaller
    # LLM that would only pay for KV cache it never uses.
    context_length: 16384

    # The spec sets thinking: true here. Measured on UD-Q3_K_XL it is not
    # viable, and the cause is specific rather than general slowness.
    #
    # SKILL.md line 37 says of the 7,000 character limit: "Count it." With
    # thinking on, the model takes that literally and brute-forces the count
    # character by character — the raw thinking transcript shows running
    # tallies (`" boarding" = 9 →200`) collapsing into per-letter indexing
    # (`H(1)e(2)r(3) space(4) h(5)a(6)n(7)d(8)s(9)`). Tokenised models cannot
    # count characters natively, so this never terminates usefully.
    #
    # One captured run: 432.8s, 12,450 tokens generated, 31,813 characters of
    # thinking, **0 characters of answer**, done_reason=length. Three separate
    # dialect runs failed the same way (twice truncated at the 16,384 ceiling,
    # once finishing with zero segment markers).
    #
    # With thinking off: ~19s, ~580 tokens, all seven segments, well inside
    # the character limit. The UI counts characters accurately anyway via the
    # char_counter binding, so nothing is lost by not having the model do it.
    #
    # Revisit on hardware where this is affordable, but re-measure rather than
    # assuming more VRAM fixes it — this is an instruction-following trap, not
    # a capacity problem.
    thinking: false
    segments:
      - "Subject definitions"
      - "Summary"
      - "Retention analysis"
      - "Detailed description"
      - "Soundscape"
      - "Music"
      - "Reasoning"
    meta_segments: ["Reasoning"]
    # A segment's UI label and its official field name can differ — SKILL.md
    # writes bodies prefixed with the field name, not the label. stripPrefix()
    # in web/app.js needs both to know what to strip on copy.
    segment_fields:
      Music: non_diegetic_music
      # Soundscape's official name, added for the same reason. Whether the
      # model prefixes a body with its field name varies run to run — measured
      # on the 27B, baseline runs returned "non_diegetic_music: N/A" while
      # patched ones returned bare "N/A". It also lets a missing-segment error
      # say something true: this content sometimes arrives inside `Detailed
      # description` under these names rather than going astray entirely.
      Soundscape: overall_soundscape
      Detailed description: integrated_multimodal_description
    # Missing reference files must degrade gracefully — log a warning naming
    # the file and continue. See prompts/video/h3/references/README.md.
    # Gated on the Mode control, 3 Sep 2026. Both guides used to load on every
    # generation, which is how h3's prompt reached 12,692 tokens and stopped
    # fitting in a 12288 context at all.
    #
    # The split needs no editing of MiniMax's documents because it already
    # falls on a file boundary: h3-base-official.md is titled "Video Prompt
    # Writing Guide (T2VA / I2VA / FL2VA / L2VA)" and h3-reference-official.md
    # is the Full-reference guide. A T2VA generation was carrying ~5,500
    # tokens of instructions for a mode it was not in.
    #
    # Auto detect used to keep BOTH, on the reasoning that the model decides
    # which mode a brief is and so cannot be shown one mode's guide. That was
    # true of the model and false of the app: the rule SKILL.md states is
    # mechanical and reads only the request, so since 3 Sep the SERVER settles
    # it — resolveAutoMode() in server/references.mjs — and the run reaches
    # here already naming T2VA, I2VA, FL2VA or REF2VA.
    #
    # Which makes this entry a safety net rather than a live path: nothing
    # should arrive still saying "Auto detect", and if something does, it gets
    # both guides and works. It also means the saving now lands on the default,
    # which is where almost every generation was: ~13,600 tokens down to ~8,100.
    #
    # An unlisted or absent mode falls back to a prompt carrying every guide,
    # so a typo here costs tokens rather than correctness. See prompts.mjs.
    # Sectioned 4 Sep 2026. The two *-official.md files are still the source of
    # truth on disk and still what `npm run fetch-h3-refs` downloads, but they
    # are no longer LOADED: scripts/section-h3-references.mjs slices them on
    # their own heading boundaries into the three files below, verbatim.
    #
    # h3-core.md is base guide section 4 — timeline, cuts, camera vocabulary,
    # speakers and dialogue, on-screen text, and the two audio fields. None of
    # it is mode-specific, which is why it sits in `reference_files` and every
    # mode gets it. The reference guide's own 5.4 and 6 cover the same ground
    # more thinly, so they are dropped there rather than duplicated here.
    #
    # What else came out, and on whose authority — the Director node that
    # consumes our output, docs/minimax_h3_director.md, which is the same
    # tiebreak server/references.mjs already applies to the label classes:
    #
    #   - The image-alignment instruction lines, base guide 2.1. The Director
    #     writes them itself from mode and duration: "you do not type them
    #     manually". A model that writes one puts a duplicate in the final
    #     prompt, so this is a correctness fix that happens to save ~220
    #     tokens. h3-base-modes.md says so in place of the dropped section.
    #
    #   - All five worked examples, base guide 5 and reference guide 7. Every
    #     one emits raw field names, and the Director appends those headers
    #     itself — "you write only the content". `segment_fields` below exists
    #     BECAUSE the 27B keeps prefixing bodies with those names; this is
    #     where it learned to. ~2,040 tokens of counter-example, and on a
    #     decensored model an example beats a rule. SKILL.md's own example is
    #     the only one in the ===SEGMENT: shape we actually parse.
    #
    # Nothing is paraphrased — README.md in that directory is right that
    # retyping these from memory is how you emit field names H3 doesn't know.
    # Re-run the script after any `fetch-h3-refs --force`.
    reference_files:
      - "prompts/video/h3/references/h3-core.md"
    reference_files_by_mode:
      "REF2VA": ["prompts/video/h3/references/h3-ref2va.md"]
      "REF2VA labelled": ["prompts/video/h3/references/h3-ref2va.md"]
      # Reachable only if something bypasses resolveAutoMode() — see above.
      "Auto detect":
        - "prompts/video/h3/references/h3-base-modes.md"
        - "prompts/video/h3/references/h3-i2va.md"
        - "prompts/video/h3/references/h3-fl2va.md"
        - "prompts/video/h3/references/h3-l2va.md"
        - "prompts/video/h3/references/h3-ref2va.md"
      # Each frame mode gets only its own part of base guide section 3, and
      # T2VA, which has no keyframe, none of it (6 Oct 2026).
      "T2VA":  ["prompts/video/h3/references/h3-base-modes.md"]
      "I2VA":  ["prompts/video/h3/references/h3-base-modes.md", "prompts/video/h3/references/h3-i2va.md"]
      "FL2VA": ["prompts/video/h3/references/h3-base-modes.md", "prompts/video/h3/references/h3-fl2va.md"]
      "L2VA":  ["prompts/video/h3/references/h3-base-modes.md", "prompts/video/h3/references/h3-l2va.md"]
    # Loaded after the required ones and absent by default. The README says to
    # write this yourself as house conventions develop, so its absence is the
    # normal state and must not trigger the "worked without the official
    # guides" note — that note told the model to work from its own
    # instructions on every single H3 generation while both official guides
    # were sitting in the prompt directly above it.
    optional_reference_files:
      - "prompts/video/h3/references/user-preferred-extensions.md"
    max_output_chars: 7000
    has_negative: false
    # A per-model `context_length` is supported here (plumbed through as
    # num_ctx) but H3 does NOT need one. It was tried at 24576 and reverted:
    # the runaway token use had nothing to do with context size. See the
    # thinking note below.
    #
    # Note if you ever do set one: num_ctx is a LOAD-TIME parameter, so a
    # value differing from the resident model's forces an ~8s Ollama reload
    # every time you switch to or from that model.

    # H3 is the only model that needs more than the global llm.timeout_ms.
    # Measured on UD-Q3_K_XL at ~36 tok/s: with thinking on it generates
    # ~8,500 tokens (23.8k chars of reasoning for a 2.4k answer) and takes
    # ~240s; with thinking off it is ~580 tokens and ~19s. Both emit all
    # seven segments correctly, so this is a latency budget, not a format
    # fix. 600s leaves headroom on a slower box or a longer brief.
    timeout_ms: 600000
    # The A suffix is audio — H3 generates native stereo. T2V/I2V/FL2V are
    # not the official names.
    # The Director's own mode names, 4 Sep 2026. "Full reference" was ours
    # alone: helper_minimax_h3_director.py raises "unsupported MiniMax Director
    # mode" on anything outside {T2VA, I2VA, FL2VA, L2VA, REF2VA, Image
    # Inpaint}, and the node's UI, its docs and both official guides all say
    # REF2VA. The mode the person picks, the Mode line the model reads and the
    # mode the node accepts are now one string.
    #
    # Image Inpaint is deliberately NOT here yet: it is a single-frame still,
    # not a video, so its segment contract would not be these seven. Owner's
    # call whether this tab should offer it at all.
    modes: ["REF2VA", "Auto detect", "T2VA", "I2VA", "FL2VA", "L2VA"]
    # Keys the per-mode maps above may use that the picker never offers.
    # "REF2VA labelled" is REF2VA with picture labels, not a seventh mode; see
    # server/picture-labels.mjs.
    mode_variants: ["REF2VA labelled"]
    default_mode: "Auto detect"
    durations: [5, 8, 10, 12, 15]
    default_duration: 10
    # The Shots control, 2 Oct 2026: a user wrote "single shot" in the brief
    # and got two. A number here goes out as a setting that overrides the
    # detail ladder's shot wording, and is counted afterwards; Auto sends
    # nothing and leaves it to the model. See server/shots.mjs.
    shot_counts: ["Auto", 1, 2, 3, 4, 5]
    default_shots: "Auto"
    aspect_ratios: ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
    default_aspect_ratio: "16:9"
    # Every reference must carry an explicit role — H3 drifts badly when
    # roles are implicit, and the system prompt refuses on unlabelled ones.
    reference_roles: ["subject", "keyframe", "style", "motion", "voice"]
    # A video-shaped detail ladder, 18 Sep 2026, on the owner's call ("ya do that
    # for now"); wan and ltx keep the shared ladder until someone reports
    # them. The shared ladder is written for a still frame (textures, foreground,
    # palette) and never asks for more shots, beats or sound, so on
    # h3 level 10 wrote no more than level 8 (213 vs 227 words) and never came
    # near the reference guide's own "normally 350-500 English words". Word
    # ranges are for Detailed description on a ~10 s clip; the model cannot
    # count exactly, but a range moves it where adjectives did not.
    detail_levels:
      1:
        label: "Bare"
        rule: "One shot, opening with [Shot 1] as always: the subject, the action and one line of camera, about 40-60 words of Detailed description. Nothing the brief did not name. This overrides the guide's usual length."
      2:
        label: "Minimal"
        rule: "One or two shots, about 60-100 words: the subject, the action, where it happens and what the camera does. This overrides the guide's usual length."
      3:
        label: "Light"
        rule: "About 100-150 words. Show the action unfolding: how each shot starts and how it ends, not a single frozen moment."
      4:
        label: "Modest"
        rule: "About 150-200 words. Give every shot its framing, its camera move, and what the light is doing."
      5:
        label: "Standard"
        rule: "About 200-280 words. Every shot says what changes during it, and the soundscape names the sound each action makes."
      6:
        label: "Full"
        rule: "About 280-350 words. Add the subject's expression and body language shot by shot, and a palette and mood in the opening style line."
      7:
        label: "Rich"
        rule: "About 350-420 words, the reference guide's own range. Add materials and surfaces and how the light moves across them as the shot plays."
      8:
        label: "Dense"
        rule: "About 420-500 words. Build out the space around the subject in each shot - what moves in front of and behind it (rain, crowds, steam, traffic) - and tie each sound cue to its shot."
      9:
        label: "Very detailed"
        rule: "About 500-600 words. Break the action into finer beats and give each new piece of information its own cut or camera change, within the clip's duration. Every sentence must be something a camera can see or a microphone can hear. This overrides the guide's 350-500 word range."
      10:
        label: "Exhaustive"
        rule: "About 600-750 words. Every shot fully specified: framing, camera move with amplitude and speed, action beat by beat, expression, light, surfaces, background motion and its sound. Every sentence must be something a camera can see or a microphone can hear - no statements of theme or feeling. This overrides the guide's 350-500 word range; the 7,000-character limit still holds."
    # A video-shaped creativity ladder, 18 Sep 2026, the owner's call alongside
    # detail_levels above. The shared rules are written for a still ("no
    # wardrobe", "a striking setting") and at Wild h3 invented an alley, steam
    # and a mannequin in a red dress; at Literal it read "add nothing" as
    # "write little" (~90 words against ~210 at Balanced, no score). Here the
    # invention is in time - beats, camera, cuts, secondary motion, sound -
    # and length is left to detail. Samplers are the shared ladder's, unchanged.
    # A reference picture is pinned in code at every notch: see
    # videoHasPicture in server.mjs.
    creativity_presets:
      literal:
        temperature: 0.30
        top_p: 0.65
        rule: "Add nothing to what happens. Shoot exactly the action they described, as plainly as it can be shot: no extra beats, props or people. Every shot still gets its camera, and the soundscape and score are still written, plainly."
      precise:
        temperature: 0.45
        top_p: 0.72
        rule: "Stay close to the brief. The camera, the cuts and the sound are your only choices, and take the plainest ones that show the action."
      faithful:
        temperature: 0.55
        top_p: 0.76
        rule: "Follow the brief, and fill only what a shot cannot be filmed without - where the camera stands, when it cuts, what the action sounds like. Take the most ordinary answer and move on."
      measured:
        temperature: 0.62
        top_p: 0.78
        rule: "Use conventional coverage: the shots and cuts an ordinary editor would use for this action, and the sounds anyone would expect to hear."
      balanced:
        temperature: 0.70
        top_p: 0.80
        rule: "Fill in what the brief leaves out - how the action unfolds, the camera, the cuts, the sound - and keep every addition in service of the scene they described."
      loose:
        temperature: 0.78
        top_p: 0.85
        rule: "Make choices with some character: a camera move or a cut with intent, a small beat of action they did not write, a sound that gives the place life."
      inventive:
        temperature: 0.85
        top_p: 0.88
        rule: "Bring your own ideas to the camera, the cutting and the sound. Add a beat of action or some secondary motion - weather, a crowd, the light changing as the clip plays - where it makes the clip stronger."
      creative:
        temperature: 0.92
        top_p: 0.92
        rule: "Expand freely in time: extra beats, a reveal, a change in the light over the clip, a score with a shape to it. Nothing you add may contradict what they wrote."
      daring:
        temperature: 1.00
        top_p: 0.94
        rule: "Push past the brief in how it is shot and told: a striking camera move, an unexpected cut, a bold score. The subject and the action they named are fixed."
      wild:
        temperature: 1.10
        top_p: 0.96
        rule: "Treat the brief as the starting point for how the clip moves and sounds: unexpected beats, bold camera and cutting, strong sound design. The subject and the action they named are fixed; how the clip unfolds around them is yours."
    reference_traits: ["keep", "drop"]

  wan:
    name: "Wan 2.2"
    label: "Wan 2.2"
    type: "video"
    template: "video-wan"
    # Opted out of the lighting slider, 8 Sep 2026. It is an image-model
    # control for now: a clip can change its exposure from shot to shot, and
    # one scalar for the whole thing is the wrong shape of control here.
    # Delete this line to switch it on for this model.
    lighting_levels: {}
    badge: "video"
    format_label: "Four-layer natural language"
    gen_button: "Generate Wan prompt"
    system_prompt: "prompts/video/wan.md"
    # One file per switchable segment, appended only when it is asked for.
    # The base file above is how this model THINKS; these are what each
    # segment is. See the note on illustrious for the whole argument.
    segment_blocks:
      "Negative prompt": "prompts/video/segments/wan-negative.md"
      "Layer breakdown": "prompts/video/segments/wan-layer-breakdown.md"
      "Reasoning": "prompts/video/segments/wan-reasoning.md"
    thinking: false
    segments: ["Positive prompt", "Negative prompt", "Layer breakdown", "Reasoning"]
    meta_segments: ["Layer breakdown", "Reasoning"]
    # wan.md: under 80 the camera layer goes undefined, over 120 the motion
    # layer dilutes. Counter renders green in-band, amber out.
    word_target: { min: 80, max: 120 }
    layers: ["Subject", "Motion", "Camera", "Scene"]
    # A wan-shaped detail ladder, 23 Sep 2026. The same call as h3's on 18 Sep,
    # and the note there - "wan and ltx keep the shared ladder until someone
    # reports them" - named this one. Reported: the slider did nothing here.
    #
    # It reached the model the whole time. Two structural reasons it could not
    # change the output, neither of them a bug in the plumbing:
    #
    #   - Six of the shared ladder's ten notches say "stay inside this model's
    #     normal length and density rules", and wan.md says "Length: 80 to 120
    #     words. Count them." Six notches, one hard band, no difference.
    #   - What the shared ladder escalates through is a still frame: palette,
    #     then materials, then foreground/background layering, then art
    #     direction. Every one of those is wan's SCENE layer - the layer
    #     wan.md calls the most compressible and tells the model to cut first.
    #     Turning the slider up asked for more of the one layer wan wants
    #     least, inside a band that left no room to put it.
    #
    # So this ladder escalates in wan's own order: Motion and Camera first,
    # because those are the layers a brief is thinnest on and the ones that
    # make it a video rather than a still, and Scene after them. Word ranges
    # rather than adjectives, for the reason h3's carry them - the model
    # cannot count exactly, but a range moves it where "richer" does not.
    #
    # 3-8 stay inside the 80-120 band and differ by which LAYER gains, not by
    # how many words it gets. 1-2 go under the band and 9-10 over it, and both
    # say so in the phrasing the slider's format warning matches, because the
    # 25 Aug call stands: the slider wins at the extremes. Past 120 the motion
    # layer dilutes into a slideshow, so 9 and 10 name where the extra words
    # go - more words with nobody directing them is exactly that failure.
    #
    # **The ranges below are measured, not chosen.** First pass, three runs a
    # notch on the P40: every notch undershot, 3/4/5/7 fell out of the band
    # entirely, and 7 came in BELOW 6 and 8 because its rule ended "Compress
    # the scene layer to stay inside the band" - an instruction to remove
    # words, doing exactly what it said. Three changes fixed the shape: 1-2
    # dropped to ranges the notch can actually reach without saying what it
    # forbids, every notch states its floor ("and not fewer than N"), and 4-9
    # carry "Everything at <the notch below>, still at its full length" so a
    # named addition cannot be read as the whole instruction. 7 now pays for
    # its materials by trading general words for precise ones.
    #
    # Tried and reverted on 9 and 10: spelling out the conflict - "the 80 to
    # 120 word band this model's format states does not apply at this notch".
    # It measured worse across five runs a notch (9's median 120 -> 104 and its
    # spread 106-129 -> 84-161) so it is not in the file, but that comparison
    # should not be quoted as a finding. See the noise floor below: a later
    # sweep moved the SAME unchanged notches by as much as that edit supposedly
    # did, which means five runs cannot tell the two apart.
    #
    # **The noise floor is wider than the tuning.** Repeat sweeps of this
    # ladder, nothing changed between them, moved notch 2 by 11 words, notch 9
    # by 15 and notch 10 by 20. Individual notches range 55-98 (notch 3) and
    # 104-157 (notch 10) across five runs at the default temperature. So the
    # honest claim is: the ladder is monotonic in the mean and spans roughly
    # 27 to 127 words end to end, and it undershoots almost every stated range
    # by 3-24 words. Anything finer than that is not measurable at this sample
    # size, and a range retuned on five runs is a range retuned on noise.
    #
    # Two known, consistent across every sweep, both his call rather than
    # mine: notches 1 and 2 land within a few words of each other and separate
    # only by content (camera held vs one camera move), and 8, 9 and 10 all
    # undershoot - the model tops out near 130 however the top notches are
    # worded. Pushing the top end further needs a proper high-sample A/B, not
    # another rewording.
    detail_levels:
      1:
        label: "Bare"
        rule: "Subject and one continuous action, about 30-45 words. Say the camera holds still, and give the scene no more than where it happens. This overrides any minimum length this model's format normally expects."
      2:
        label: "Minimal"
        rule: "About 45-65 words: the subject with two identifying details, the action, one camera move, and where it happens. Nothing further. This overrides any minimum length this model's format normally expects."
      3:
        label: "Light"
        rule: "About 80-95 words and not fewer than 80 - under 80 this model's camera layer goes undefined. All four layers present and each said once: two identifying details on the subject, the action as verbs in sequence, one named camera move, and the place."
      4:
        label: "Modest"
        rule: "About 90-105 words and not fewer than 90. Everything at Light, still at its full length, and the motion gains its tempo and its manner - how fast, how smoothly, how deliberately the action is performed - because tempo is what this model can actually follow."
      5:
        label: "Standard"
        rule: "About 95-110 words and not fewer than 95. Everything at Modest, still at its full length, and a complete camera layer: the starting framing and angle, the move, and where it settles."
      6:
        label: "Full"
        rule: "About 105-120 words and not fewer than 105. Everything at Standard, still at its full length, and the scene gains two or three concrete objects rather than a category name while the light gains a source, a direction and a quality."
      7:
        label: "Rich"
        rule: "About 110-120 words and not fewer than 110. Everything at Full, still at its full length, and the subject gains materials and surfaces - fabric, skin, metal, hair - and what the light does on them while the action plays. Pay for them by trading general words for precise ones, never by dropping or shortening a layer."
      8:
        label: "Dense"
        rule: "About 115-120 words and not fewer than 115, the dense end of this model's band. Everything at Rich, and secondary motion the main action does not cause - steam, rain, dust, fabric settling, someone passing behind - with the part of the clip it happens in. Hold the total at or under 120 by tightening the wording rather than by cutting a layer: this notch is dense, not long. Still one continuous action and one camera move."
      9:
        label: "Very detailed"
        rule: "About 130-150 words and not fewer than 130. Everything at Dense, and the continuous action broken into finer beats with an amplitude and a speed on the camera move. The extra words go to motion and camera, not to the scene. This overrides any maximum length this model's format normally expects."
      10:
        label: "Exhaustive"
        rule: "About 150-180 words and not fewer than 150. Every layer fully specified: the subject and its materials, the action beat by beat with its tempo, the camera's framing, angle, move, amplitude and where it settles, then the scene with its objects, its light and its secondary motion. Every phrase must be something a camera can see. This overrides any maximum length this model's format normally expects - it is still one continuous action and one camera move, and length is the only rule this notch breaks."
    supports_i2v: true
    # Wan takes a first frame, or a first and a last. Two is the ceiling —
    # more images is a different model's feature, not a bigger version of
    # this one. The mode is what decides whether a last frame exists at all,
    # so dropping back to a single image cannot leave one armed.
    i2v_modes: ["Single image", "First + last image"]
    default_i2v_mode: "Single image"
    negative_defaults: "morphing, warping, flickering, distorted hands, duplicate limbs, sudden identity change, text overlay, watermark"

  ltx:
    name: "LTX 2.3"
    label: "LTX 2.3"
    type: "video"
    template: "video-ltx"
    # Opted out of the lighting slider, 8 Sep 2026. It is an image-model
    # control for now: a clip can change its exposure from shot to shot, and
    # one scalar for the whole thing is the wrong shape of control here.
    # Delete this line to switch it on for this model.
    lighting_levels: {}
    badge: "video"
    format_label: "Single flowing paragraph"
    gen_button: "Generate LTX prompt"
    system_prompt: "prompts/video/ltx.md"
    # One file per switchable segment, appended only when it is asked for.
    # The base file above is how this model THINKS; these are what each
    # segment is. See the note on illustrious for the whole argument.
    segment_blocks:
      "Improvement notes": "prompts/video/segments/ltx-improvement-notes.md"
    thinking: false
    segments: ["Enhanced paragraph", "Improvement notes"]
    meta_segments: ["Improvement notes"]
    has_negative: false
    word_target: { min: 60, max: 120 }
    # ltx.md forbids these outright — each nudges LTX toward static or
    # discontinuous framing. The output panel flags any that appear.
    forbidden_words: ["shot", "scene", "frame", "cut"]
    # An LTX-shaped detail ladder, 23 Sep 2026, right after wan's and for the
    # same reason: the shared ladder is written for a still and cannot move a
    # model with a hard word band. See the long note on wan above for the
    # argument. Three things make this one different from wan's, and all three
    # are in the rule text rather than in code:
    #
    #   - **Length arrives as clauses, not sentences.** ltx.md's whole case is
    #     that a sentence boundary reads as a break in the continuous take, and
    #     "write more" is exactly the pressure that turns one paragraph into
    #     five short sentences - the documented failure this format exists to
    #     avoid. So the two notches that ask for extra length say where it goes,
    #     the same way wan's 9 and 10 do.
    #   - **The word count is the FINISHED paragraph**, said on every notch
    #     that carries a number. In Director mode the model writes a Global
    #     prompt plus up to eight segments and the node joins them into one
    #     string; a range read per segment instead of per paragraph would be
    #     eight times the intended length. Cheap clause, expensive failure.
    #   - **Sound is a notch, and it is switchable.** Woven audio is what makes
    #     this model different, so it escalates alongside the picture rather
    #     than after it - but the audio toggle can be Silent, and ltx.md says to
    #     omit sound language entirely then. The notches that ask for sound say
    #     what to spend those words on instead.
    #
    # The four words in forbidden_words above are deliberately absent from
    # every rule here. These strings go into the user turn, and the surest way
    # to get a banned word into the output is to put it in the instructions.
    detail_levels:
      1:
        label: "Bare"
        rule: "About 20-35 words in the finished paragraph. The subject, the one thing it does, and where it happens, with the camera named as a continuous movement or as explicitly holding still. No light, no surfaces, no sound. This overrides any minimum length this model's format normally expects."
      2:
        label: "Minimal"
        rule: "About 45-60 words in the finished paragraph. The subject, what it does, where it happens, how the camera moves through it, and - with audio on - one clause of sound attached to the action. Nothing further. This overrides any minimum length this model's format normally expects."
      3:
        label: "Light"
        rule: "About 60-75 words in the finished paragraph, the bottom of this model's band. Everything dissolved into one unbroken chain of clauses: who, what they do, where, the camera easing through it, and - with audio on - the sound of the action carried in the same breath as the action."
      4:
        label: "Modest"
        rule: "About 75-90 words in the finished paragraph. The movement gains its manner and its tempo, and the camera gains where it begins and where it comes to rest, both as continuous verbs rather than as instructions."
      5:
        label: "Standard"
        rule: "About 85-100 words in the finished paragraph. The light gains a source, a direction and a quality, carried in the same clause flow as everything else rather than added on at the end."
      6:
        label: "Full"
        rule: "About 95-110 words in the finished paragraph. Sound gains a second layer, each one attached to the thing that makes it - and with audio silent, spend those words on a second continuous movement instead. Make room for it by tightening what is already there rather than adding to the end."
      7:
        label: "Rich"
        rule: "About 105-120 words in the finished paragraph. Materials and surfaces arrive - fabric, skin, metal, water - and what the light does across them while the movement plays. Make room for them by replacing general words with precise ones, not by adding clauses."
      8:
        label: "Dense"
        rule: "About 110-120 words in the finished paragraph, and 120 is the ceiling. Add what else moves in the space - rain, steam, drifting dust, someone passing behind - and, with audio on, the sound each of those makes, still joined into the same unbroken chain of clauses. Hold the total at or under 120 by tightening every other clause to pay for them: this notch is dense, not long. Going past 120 is what the two notches above this one are for."
      9:
        label: "Very detailed"
        rule: "About 130-155 words in the finished paragraph. The extra length arrives as more clauses joined by commas and participles, never as more sentences - one or two sentences in total however long the paragraph runs. This overrides any maximum length this model's format normally expects."
      10:
        label: "Exhaustive"
        rule: "About 155-185 words in the finished paragraph: the subject and its materials, the movement beat by beat with its tempo, where the camera travels and where it settles, the light and what it touches, whatever else moves in the space, and - with audio on - the sound of all of it. Still one or two sentences built from commas and participial clauses, because a full stop is a break in the continuous take: the length may grow and the sentence count may not. This overrides any maximum length this model's format normally expects."
    supports_audio: true
    quality_modes: ["Pro", "Fast"]
    default_quality_mode: "Pro"
    # Two shapes for the same dialect, not two dialects. Paragraph is the
    # single flowing paragraph ltx.md specifies. Director splits that same
    # prose across a timeline for WhatDreamsCost's LTX Director node, which
    # concatenates global + every segment into ONE string before it reaches
    # the text encoder — see prompt_relay.py, quoted in the context doc. That
    # is why there are no timecodes in the output and why the forbidden words
    # still apply: the joined result has to read as continuous prose.
    modes: ["Paragraph", "Director"]
    # Director, from 10 Sep 2026. The owner's call, and his reason: "ltx
    # director is like the main way this whole thing works". Every LTX clip
    # this group makes goes through WhatDreamsCost's node, so the timeline is
    # the ordinary path and the bare paragraph is the exception.
    #
    # Paragraph is kept rather than removed. It is the whole clip as one
    # unbroken paragraph with no timeline, which is what LTX takes without the
    # node, and it is the path `npm run dialect` measures — nothing on the
    # server reads this key, so that suite is unaffected either way.
    default_mode: "Director"
    director_max_segments: 8
    director_frame_rates: [24, 25, 30, 50, 60]
    director_default_frame_rate: 24
    director_default_duration: 5
    # 60 confirmed ample by the owner, 22 Aug 2026 — it was an arbitrary pick
    # until then. It is a ceiling on the builder, not a claim about what LTX
    # 2.3 will render; the box enforces it so the ruler, the value and the
    # duration the model is told cannot disagree.
    director_max_duration: 60

