# PromptForge — model registry
#
# Single source of truth for every model surface in the app. The frontend
# builds its selectors, badges, templates, quality presets and button labels
# from GET /api/models, which derives from this file. Adding a model is one
# entry here + one prompt file + one template file. No code changes.
#
# Keys are canonical and appear in user preferences, library entries and the
# training queue. They match the mockup's MODEL_REGISTRY and the
# `default_video_model` field in the preferences schema. Do not rename them
# without a migration.
#
# `segments` must match the "Segments to emit" list in that model's prompt
# file exactly, including case and order. registry.mjs validates this at boot
# and the segment parser drives its output contract from it. The parser also
# accepts `Refused` from any model as a terminal segment — house-rules.md
# mandates it for policy refusals but no model lists it.

defaults:
  # Applies to every model unless overridden. The image models' worked
  # examples in prompts/image/*.md carry a "Creativity" control alongside
  # the quality preset, so this is not H3-only.
  # Creativity moves two things: the sampler, and how far past the brief the
  # model is allowed to go. It used to move only the sampler — the label
  # "Creativity: Balanced" reached the model with no meaning attached to it,
  # and how much to invent was left to whatever the prompt file happened to
  # say. Added 30 Aug 2026, on the owner's call: "gatekeep the creativity to
  # the slider too".
  #
  # That matters more now that a tag lookup sits in front of the model. Both
  # server/candidates.mjs and prompts/_shared/tag-search.md tell it to write
  # past what the lookup found, and without this line that instruction has no
  # ceiling — "precise" and "wild" would expand exactly as far as each other.
  #
  # `rule` is injected verbatim into the user turn by buildUserMessage, the
  # same way detail_levels below are, and lives here so the wording is the
  # owner's to change without a code edit.
  #
  # Widened from four presets to ten on 4 Sep 2026, on the owner's call. The
  # names still reach the model as names, so prompts/video/h3/SKILL.md and
  # prompts/_shared/tag-search.md - both of which name Precise and Wild - are
  # still correct; they now describe the two ends of a longer ladder rather
  # than the whole of a short one. `balanced` must keep existing under that
  # exact key: samplingFor in server.mjs falls back to it when a preset name
  # does not resolve.
  creativity_presets:
    literal:
      temperature: 0.30
      top_p: 0.65
      rule: "Add nothing. Put exactly what the person wrote into this model's dialect and stop. If they left something out it stays out - no setting, no light, no mood, no wardrobe that is not already in the brief."
    precise:
      temperature: 0.45
      top_p: 0.72
      rule: "Stay close to what the person wrote. Put what they named into this model's dialect and add only what the image cannot be built without. Do not invent a setting, a mood or a wardrobe they did not ask for."
    faithful:
      temperature: 0.55
      top_p: 0.76
      rule: "Follow the brief closely, and fill only the gaps that would otherwise leave the image undefined - where this happens, what the light is doing. Take the most ordinary answer available and move on."
    measured:
      temperature: 0.62
      top_p: 0.78
      rule: "Complete the scene they described using conventional, expected choices. Every addition should be one they would have written themselves had they thought of it."
    balanced:
      temperature: 0.70
      top_p: 0.80
      rule: "Fill in what the brief leaves out - setting, light, framing, the detail they did not think to write - but keep every addition in service of the scene they described."
    loose:
      temperature: 0.78
      top_p: 0.85
      rule: "Fill the gaps with choices that have some character to them rather than the safest one. You may add a supporting element they never mentioned, as long as the scene they described is still the subject."
    inventive:
      temperature: 0.85
      top_p: 0.88
      rule: "Bring your own ideas to the setting, the light and the framing. Add elements they never asked for where they make the image stronger, and let the atmosphere be a deliberate choice rather than a default."
    creative:
      temperature: 0.92
      top_p: 0.92
      rule: "Expand freely. Add atmosphere, framing and supporting detail they never asked for, as far as it makes the image better. Nothing you add may contradict what they did write."
    daring:
      temperature: 1.00
      top_p: 0.94
      rule: "Push well past the brief. Reach for a striking setting, a strong light and an unusual angle rather than a plausible one. The subject and the action they named are fixed; treat everything else as an invitation."
    wild:
      temperature: 1.10
      top_p: 0.96
      rule: "Treat the brief as a starting point and build well past it. Unexpected detail, strong atmosphere and bold framing are wanted here. Only the subject and the action they named are fixed; everything around them is yours."
  default_creativity: "balanced"

  # Detail - the second axis, added 25 Aug 2026. Creativity decides how much
  # the model may invent; detail decides how much it writes down. They were
  # one dropdown before and the two kept getting confused: someone wanting a
  # denser prompt reached for "wild" and got an invented scene instead.
  #
  # The rule text is injected verbatim into the user turn by buildUserMessage
  # in server.mjs. It lives here rather than in code so the wording is the
  # owner's to change without a code edit - the same reason the quality and
  # creativity presets live here.
  #
  # **Levels 3-8 stay inside whatever the model's own prompt file allows** -
  # wan's 80-120 word target, the booru tag ceilings. Only 1-2 and 9-10 may
  # break it, and they say so in as many words, because that was the call on
  # 25 Aug: the slider wins at the extremes. Anything softer makes the top
  # notch indistinguishable from the one below it on the constrained models,
  # which is the whole reason for a slider.
  #
  # Widened from five levels to ten on 4 Sep 2026, on the owner's call. Five
  # notches with three of them saying "stay inside the model's rules" gave
  # three settings that differed only in adverbs. Each level here instead
  # names the specific thing it ADDS to the one below - setting, then light,
  # then mood and palette, then materials, then spatial layering - so the
  # difference between two adjacent notches is a category the model can act
  # on rather than a degree it has to guess at.
  detail_levels:
    1:
      label: "Bare"
      rule: "Subject and action only. No setting, no lighting, no framing. This overrides any minimum length or tag count this model's format normally expects."
    2:
      label: "Minimal"
      rule: "The subject, the action and where it happens. Nothing further. This overrides any minimum length or tag count this model's format normally expects."
    3:
      label: "Light"
      rule: "Subject, action, setting, and one note on how the shot is framed. Stay compact, and stay inside this model's normal length and density rules."
    4:
      label: "Modest"
      rule: "Cover the subject, the setting, the framing and what the light is doing - each once, briefly. Stay inside this model's normal length and density rules."
    5:
      label: "Standard"
      rule: "Ordinary density: composition, viewpoint, lighting and setting each covered once. Stay inside this model's normal length and density rules."
    6:
      label: "Full"
      rule: "Everything at Standard, plus the mood and the palette - what the scene feels like and which colours carry it. Stay inside this model's normal length and density rules."
    7:
      label: "Rich"
      rule: "Add materials and surfaces - fabric, skin, metal, stone, water - and how the light behaves on each. Stay inside this model's normal length and density rules."
    8:
      label: "Dense"
      rule: "Build out the spatial relationships and the supporting cast of the frame: what sits in front of the subject, what sits behind, what sits beside. Stay inside this model's normal length and density rules, at the dense end of them."
    9:
      label: "Very detailed"
      rule: "Layer the frame front to back - foreground, subject, background - each carrying its own detail, and give the whole an explicit art direction. This overrides any maximum length or tag count this model's format normally expects."
    10:
      label: "Exhaustive"
      rule: "Specify every visually useful aspect: layered foreground, subject and background, precise lighting, palette, textures and art direction. This overrides any maximum length or tag count this model's format normally expects."
  default_detail: 5

  # Lighting - the third slider axis, added 8 Sep 2026. A user's scale and
  # A user's wording, both shipped as written.
  #
  # The problem it solves is a model habit rather than a missing feature: asked
  # for anything intimate, dramatic, cinematic, nocturnal or indoors, the model
  # reaches for amber lamps and crimson shadow whether or not the brief wanted
  # a dark picture. There was no way to say "this is a bright scene" that the
  # model did not immediately reinterpret as a mood.
  #
  # **Level 0 is OFF and is the default.** Nothing is injected at 0, so a
  # person who never touches this slider gets exactly the prompt this app
  # produced before it existed - the owner's call, and the reason the ladder
  # starts at 0 rather than defaulting to the neutral middle. The scale is
  # exposure only: 1 is nearly black, 6 is neutral, 10 is flooded with light.
  #
  # IMAGE MODELS ONLY for now. h3, wan and ltx each set `lighting_levels: {}`
  # to opt out, because a clip can change its exposure across shots and one
  # scalar for the whole thing is the wrong control there. Deleting that line
  # on a video model is all it takes to switch this on for it.
  #
  # The rule text is injected verbatim into the user turn by buildUserMessage
  # in server.mjs, exactly as detail_levels and creativity_presets are, and it
  # lives here so the wording stays the owner's without a code edit.
  lighting_rule: "LIGHTING LEVEL IS AUTHORITATIVE. It controls overall exposure and scene brightness only. Never darken a scene because it is intimate, dramatic, cinematic, nocturnal, or indoors. Do not automatically introduce amber lamps, candles, crimson shadows, or low-key lighting. Preserve any explicitly requested light source, color temperature, time of day, and palette while adapting their intensity to the selected level."
  lighting_levels:
    # No rule, so nothing is sent. The slider still renders this notch, and it
    # is where it sits until somebody moves it.
    0:
      label: "Off"
    1:
      label: "Near-black"
      rule: "Near-black exposure. Most of the frame disappears into shadow; only essential silhouettes and tiny highlights remain visible."
    2:
      label: "Very dark"
      rule: "Very dark low-key exposure. One weak localized source reveals limited contours while deep shadows dominate the image."
    3:
      label: "Dark"
      rule: "Dark exposure. The principal subject and action remain readable, but the environment recedes heavily into shadow."
    4:
      label: "Dim"
      rule: "Dim exposure with subdued illumination and broad shadows. Faces, bodies, and important objects remain clearly distinguishable."
    5:
      label: "Moderate"
      rule: "Moderately lit scene with controlled contrast. All essential subjects are readable, shadows retain detail, and highlights remain restrained."
    6:
      label: "Neutral"
      rule: "Neutral, balanced exposure. Clear key and fill illumination reveal the subjects and surroundings without an intentionally dark or bright bias."
    7:
      label: "Bright"
      rule: "Bright, well-lit exposure. Open shadows, clearly visible surroundings, accurate colors, and abundant illumination across the subjects."
    8:
      label: "Very bright"
      rule: "Very bright exposure produced by broad, powerful illumination. Minimal deep shadow, high environmental visibility, and crisp material detail."
    9:
      label: "High-key"
      rule: "Luminous high-key exposure. Soft shallow shadows, bright backgrounds, airy tonal values, and consistently illuminated subjects throughout the frame."
    10:
      label: "Radiant"
      rule: "Extremely bright high-key exposure. The entire scene is flooded with light and nearly shadowless while preserving highlight detail and avoiding blown-out whites."
  default_lighting: 0

  # Whether the switchable segments start ON or OFF for somebody who has never
  # touched them. "off" from 5 Sep 2026, on the owner's call.
  #
  # Which segments those are is per model and decided by server/segments.mjs —
  # the negative prompt and the "explain yourself" ones. A person who wants
  # them ticks them on in the builder and that choice is stored; this only
  # decides where everyone starts.
  #
  # Off is the honest default now that a switched-off segment is genuinely not
  # written rather than written and hidden. The negative prompt is assembled by
  # the server from negative_defaults on the models that have one, so asking
  # the model for it was buying nothing on those, and the explaining segment is
  # a footnote most people do not read. Measured saving with both off, per
  # model: wan 38%, illustrious 31%, ltx 25%, krea2 18%, anima 14%, h3 5%.
  optional_segments_default: "off"

  # Reference images on the image models — what a picture is FOR, and how
  # hard to follow it. Added 26 August 2026.
  #
  # Tagging a reference says what is IN it. It does not say why it was
  # attached, and those are different questions: the same photograph is a
  # character sheet, an outfit swatch or a lighting study depending on what
  # the person wanted from it, and a tag dump reads identically in all three
  # cases. The vocabulary below is adapted from the French contributor's own
  # build, which had this and we did not.
  #
  # Both lists live here rather than in code for the same reason the quality
  # and creativity presets do: the wording is the owner's to change without a
  # code edit, and the frontend builds its selectors from whatever is here.
  #
  # NOT the same thing as `reference_roles`, which is h3 only and is bound to
  # the MiniMax Director's own label classes — see server/references.mjs.
  # These feed an image prompt and answer to nothing but the prompt files.
  image_reference_roles:
    # First, and the broadest. Asked for 9 Sep 2026: "can we have one more
    # instance of the 'this picture is for' where its just a generalized 'look
    # at this' so i can give it an image and be like 'replace this character
    # with this character' cause currently i cant figure out which section id
    # select for that".
    #
    # Every other role below is a single aspect — one of them is the answer
    # when you want a coat or a posture, and none of them is the answer when
    # you want THIS PICTURE with somebody else in it. Character came closest
    # and is wrong in a way that shows: on a two-person reference it reads as
    # a question about one person, and the reported result is that the second
    # subject "gets ignored and wont get prompted in".
    #
    # **It takes its orders from the brief, not from this line.** That is the
    # second half of the same conversation: "cant we just give it the photo
    # with just the instructions given via user prompts and then have it have
    # the proper output where it says what it grabs and what it ignores?"
    #
    # He is right, and it is the better shape. Every other role here is the
    # app guessing in advance at a question the person has already answered in
    # words — "replace the blue haired girl with frieren" says which one goes,
    # which one stays, and that everything else holds, and no dropdown can say
    # that. So this role has no aspect of its own: the brief and the note
    # decide, the default when they are silent is that everything stays, and
    # the reading reports what it took and what it left either way.
    #
    # Deliberately NOT in ROLE_CARRIES_CHARACTER (web/appearance.js): in a
    # two-subject picture a single `character` field cannot say whether it
    # names the one being replaced or the one staying, so it names neither and
    # the brief decides. Also deliberately absent from ROLE_KEEPS, where
    # absent means "greys nothing" — right here and nowhere else.
    general:
      label: "General"
      rule: "your brief decides. Say what to change — \"replace the blue haired girl with Frieren\" — and everything you did not mention stays as it is: the other people, their clothes, the setting, the framing, the light. The read-back lists what it took and what it left"
      # Changes what the reading pass is told the BRIEF is. Under every other
      # role the brief is context — it says which parts of a picture will
      # matter, and an analyst that acted on it would be answering the request
      # instead of reading the photograph. Under this one it is the
      # instruction, and calling it context would be telling the model to
      # ignore the only thing deciding what to take.
      #
      # A flag rather than the role key, so a second brief-driven role later
      # is a config edit and not a code edit — the same rule as everything
      # else in this file. Read in server/refblueprint.mjs.
      driven_by_brief: true
      # What the COMPILER is told this role is. `rule` above is written for
      # the person reading the dropdown and mentions the read-back, which is
      # machinery the prompt writer has no business hearing about.
      compile_rule: "the whole picture. Everything in the reading below carries into the prompt except what the brief asked to change — every person in it, their clothes, what they are doing, the setting, the framing and the light"
      # The shared fidelity rules are written for aspect roles and are wrong
      # here — `exact` says "take nothing else from that picture", which is
      # the opposite of this role's whole contract. Overridden so the control
      # means something instead of contradicting the role.
      fidelity_rules:
        exact:
          rule: "The reading is the specification. Reproduce everything in it that the brief did not ask you to change — every person, their clothes, what they are doing, the setting, the framing, the light. Change only what was asked for."
        close:
          rule: "Follow the reading closely. Keep every person, their clothes, what they are doing and where, allowing small variation in wording and incidental detail. Change only what the brief asked for."
        attribute:
          rule: "Keep the subject, what they are doing and the count exactly as the reading has them. Treat the setting, the light and the palette as free."
        loose:
          rule: "Treat the reading as direction. Keep who is in it, how many, and what they are doing; everything else may drift. Change what the brief asked for."
      # `rule` is the line under the dropdown, for a person. `extract` and
      # `ignore` are for the reading pass, and ONLY the roles actually
      # attached to a request are sent — which is the whole point of them
      # living here.
      #
      # They were prose in prompts/_shared/reference-blueprint.md until
      # 9 Sep 2026, all nine roles at once, and that file had grown to 1,564
      # words. A user's spec for this pass is a twenty-word system instruction
      # with the role travelling per picture, and the owner's report is that
      # his build reads a pose correctly where ours coin-flips. Our own note
      # says the same thing in general — his 220-word prompt beat our
      # 2,889-word one — so an analyst wading through eight roles it was not
      # given, to find the one it was, is the thing to fix first.
      extract: >-
        The brief is your instruction. Say how many people are in the frame in
        your first sentence, and make each one identifiable without naming
        them — where they are, their hair, what they wear. Everything the
        person did not ask to change stays, described well enough to be
        redrawn: the other people, what each wears, what each is doing, how
        the bodies are held up and what is touching what, the setting, the
        framing, the light. Describe each body as well as its clothes — build,
        proportions, what is bare and what is covered, and the anatomy the
        picture actually shows. That is half of what an image is and it is the
        half most often skipped; a prompt written without it comes back with a
        different body in the same outfit. Describe the thing being replaced too, as a slot —
        where it sits, how it is posed, its scale against the rest. When they
        say to keep "the same" clothes, pose or hair, they mean the ones
        belonging to the person being replaced — never another person's in the
        same picture.
      ignore: >-
        Only what the person's own instruction rules out. Told to change the
        background, ignore the background. Otherwise nothing.

    # ── The A/B arm ──────────────────────────────────────────────────────
    #
    # Identical to General in every respect except `tag_hints`, which hands
    # the reading pass animetimm's confident guesses about the same picture —
    # see reference_tag_hint_threshold below.
    #
    # It exists as a separate row rather than as a switch because two people
    # are going to run it against the plain one on real work: "when you
    # implement it do it as 'general testing' as the name and ill try it and
    # have a user try it too... if it works well then we can remove that and
    # implement it across the board but it needs real testing".
    #
    # **Three runs here could not tell it apart from the prompt-size fix that
    # landed the same hour.** The pose was already 3 of 3 without hints; the
    # flower crown went 0 of 3 to 1 of 3, which is one run and not a result.
    # The tagger's raw numbers are the reason to keep trying — `princess_carry`
    # at 1.00 and `head_wreath` at 0.88 on the picture where the reading kept
    # losing both — but a number that good in the tagger has still not been
    # shown to reach the prompt.
    #
    # WHERE IT LANDS IF IT WINS, and this is the owner's shape rather than the
    # obvious one: it does NOT fold into General. It stays a second row,
    # renamed "General 18+" — "we can still keep general and then have a
    # general 18+ for everything else and all we have is one extra 'this
    # picture is for' slot which is still a total win".
    #
    # That is better than folding it in. The anatomy vocabulary is dead weight
    # on a landscape or a costume reference, the choice is per picture rather
    # than per account, and nobody has to reason about whether a switch is on.
    # Renaming this entry's key and label is the whole of that change.
    #
    # WHEN IT LOSES: delete this entry and nothing else changes.
    #
    # IT WON (26 Sep 2026): renamed "General 18+" as planned above, with an
    # `info` popout saying what it is for. The key stays general_testing so
    # saved sessions and scripts/test-refblueprint.mjs keep resolving it -
    # the key is never shown to anyone.
    general_testing:
      label: "General 18+"
      rule: "the same as General, plus the image tagger's own reading of the picture handed to the model as a hint"
      # Shown behind the small ⓘ beside the hint. For people, never sent to
      # the model (neither is `rule` for this role - see compile_rule).
      info: "Tags NSFW content more accurately than General, so pick this one for NSFW references. For anything else General is the better fit: the extra anatomy vocabulary is dead weight on a landscape or a costume reference."
      # The rule above is a note to the two people testing this, and it went
      # to the MODEL as an instruction about somebody's photograph until
      # 9 Sep 2026 — "Being tried against General, pick whichever gives you
      # better output" is not a thing to tell a prompt writer. Identical to
      # General's, because the arms must differ only in tag_hints.
      compile_rule: "the whole picture. Everything in the reading below carries into the prompt except what the brief asked to change — every person in it, their clothes, what they are doing, the setting, the framing and the light"
      driven_by_brief: true
      tag_hints: true
      # The shared fidelity rules are written for aspect roles and are wrong
      # here — `exact` says "take nothing else from that picture", which is
      # the opposite of this role's whole contract. Overridden so the control
      # means something instead of contradicting the role.
      fidelity_rules:
        exact:
          rule: "The reading is the specification. Reproduce everything in it that the brief did not ask you to change — every person, their clothes, what they are doing, the setting, the framing, the light. Change only what was asked for."
        close:
          rule: "Follow the reading closely. Keep every person, their clothes, what they are doing and where, allowing small variation in wording and incidental detail. Change only what the brief asked for."
        attribute:
          rule: "Keep the subject, what they are doing and the count exactly as the reading has them. Treat the setting, the light and the palette as free."
        loose:
          rule: "Treat the reading as direction. Keep who is in it, how many, and what they are doing; everything else may drift. Change what the brief asked for."

      extract: >-
        The brief is your instruction. Say how many people are in the frame in
        your first sentence, and make each one identifiable without naming
        them — where they are, their hair, what they wear. Everything the
        person did not ask to change stays, described well enough to be
        redrawn: the other people, what each wears, what each is doing, how
        the bodies are held up and what is touching what, the setting, the
        framing, the light. Describe each body as well as its clothes — build,
        proportions, what is bare and what is covered, and the anatomy the
        picture actually shows. That is half of what an image is and it is the
        half most often skipped; a prompt written without it comes back with a
        different body in the same outfit. Describe the thing being replaced too, as a slot —
        where it sits, how it is posed, its scale against the rest. When they
        say to keep "the same" clothes, pose or hair, they mean the ones
        belonging to the person being replaced — never another person's in the
        same picture.
      ignore: >-
        Only what the person's own instruction rules out. Told to change the
        background, ignore the background. Otherwise nothing.
    character:
      label: "Character"
      rule: "who is in the picture: face, hair, build, distinguishing features"
      extract: >-
        Face and the features that make it that face; hair and eyes; skin;
        build; distinctive anatomy; accessories that belong to the character
        rather than to this picture.
      ignore: "The pose, the outfit, the setting, the lighting, the composition."
    outfit:
      label: "Outfit"
      rule: "clothing, materials, colours and accessories"
      extract: >-
        The garments one at a time, what state each is in, materials and
        colours, footwear, worn accessories.
      ignore: "Who is wearing it, their body, their pose, the setting, the lighting."
    background:
      label: "Background"
      rule: "the setting: place, architecture, depth, what sits behind the subject"
      extract: >-
        The location, architecture, how the space is organised, surfaces, and
        the objects in the environment that matter to it.
      ignore: "Everyone in it and everything about them."
    pose:
      label: "Pose"
      rule: "posture, body orientation, hands, and where the gaze goes"
      extract: >-
        Torso and head orientation; where the arms and hands are; where the
        legs are; joint angles; what is touching what; how the subjects are
        placed relative to each other; where the weight is and what is holding
        it up; gaze and expression where they are part of the posture; camera
        direction and crop where the geometry needs them.
      ignore: >-
        Who this is; hair, eyes, hairstyle; body characteristics; clothing and
        footwear; accessories; the background; lighting and palette; the
        drawing style. The character named in the brief replaces the person
        you can see.
    object:
      label: "Object"
      rule: "a prop or accessory: its shape, material and where it sits"
      extract: "The specific thing: shape, material, size, wear, and where it sits."
      ignore: "The person holding it and everything around it."
    style:
      label: "Visual style"
      rule: "rendering, technique, texture and art direction"
      extract: "Medium, rendering, linework, texture, finish, art direction."
      ignore: "What is depicted."
    composition:
      label: "Composition"
      rule: "framing, angle, perspective and how the subjects are arranged"
      extract: >-
        Camera angle, framing and crop, perspective, where the subjects sit in
        the frame, what the eye lands on first.
      ignore: "Who is in it, what they wear, what they are doing, the palette."
    lighting:
      label: "Lighting"
      rule: "light direction, palette, contrast and atmosphere"
      extract: >-
        Where the light comes from, its quality and colour, contrast, how it
        falls across the subject, the palette.
      ignore: "Everything the light is falling on."
  # The brief-driven one, from 9 Sep 2026. It was `character` before, which is
  # the narrowest possible reading of a picture somebody just attached, and the
  # report was "i cant figure out which section id select for that" — for the
  # commonest thing anyone does with a reference.
  #
  # A card that opens on "General" needs no decision at all:
  # drop the picture, type what you want, generate. The other eight are still
  # there for when you want one aspect and nothing else, which is the case that
  # genuinely benefits from being asked.
  default_image_reference_role: "general"

  # How closely the reference should be followed. Four levels, deliberately —
  # "copy it" and "something like it" are the two ends people actually mean,
  # and two steps between them are enough to land anywhere useful.
  #
  # The rule text is injected verbatim, the same way detail_levels is. Note
  # what none of them says: none instructs the model to describe the picture.
  # It never sees the picture — only tags read from it on this machine — and a
  # rule implying otherwise would be asking it to invent.
  reference_fidelity:
    exact:
      label: "Reproduce faithfully"
      rule: "Carry the traits listed for this reference through unchanged. Do not substitute or reinterpret them, and take nothing else from that picture."
    close:
      label: "Keep most of it"
      rule: "Keep the traits listed for this reference, allowing small variation where the brief needs it. Nothing else about that picture comes with them."
    attribute:
      label: "Take one attribute"
      rule: "Take only the attributes named for this reference and ignore everything else about it."
    loose:
      label: "Loose inspiration"
      rule: "Treat this as direction rather than instruction. Echo its character; match nothing exactly."
  default_reference_fidelity: "close"

  # How many reference images one prompt may carry. A ceiling rather than a
  # target: past a handful they start contradicting each other and the model
  # has no way to choose between them.
  max_image_references: 6

  # ── The tagger's guesses, handed to the reading pass as a hint ────────────
  #
  # Asked for 9 Sep 2026: "is there a way we can use the tags generated by the
  # animetimm as a loose reference. theres some things that the tagger picks up
  # that the model refuses to use such as certain positions and parts that
  # arent being picked up from the model."
  #
  # He is right, and the evidence is unusually clean. animetimm on a
  # two-character princess-carry reference returned `princess_carry` at 1.00,
  # `head_wreath` at 0.88 and `1girl`/`1boy` at 0.99/0.97 — which are exactly
  # the three things the vision pass kept getting wrong: it called the pose
  # "sitting on lap" half the time, dropped the flower crown on every run, and
  # tagged a boy and a girl `2girls`.
  #
  # **A hint, and only to the analyst.** It goes into the READING call, which
  # is looking at the photograph and can confirm or reject each line. It does
  # not go to the compile call, which has no picture and could only take them
  # on trust — that would be the tagger auto-inject the owner objected to on
  # 8 Sep, arriving through a side door.
  #
  # **The threshold is the whole design.** The same run returned 136 tags and
  # the tail is noise — `ice_skates` at 0.06, `virtual_youtuber` at 0.14,
  # `@_@` at 0.07. His constraint: "i just dont want lose what we already have
  # thats why i want it as a loose reference not a full ref". Sending all of
  # them would undo the prompt-size fix that made the reading reliable in the
  # first place.
  #
  # 0.60 and 20 come off that measured list: above 0.60 every tag is one a
  # person would agree with, and it stops at 26 tags naturally. Set the
  # threshold above 1 to switch the hint off entirely.
  # Lowered from 0.60/20 on 9 Sep 2026, when the blind spot got named:
  # "those more nsfw or anatomy or positions needed for that civitia red side
  # would really help with which is our one blind spot to make this next
  # level".
  #
  # Measured on the same 136-tag run: every NSFW and anatomy tag on that
  # picture scores BELOW the old floor — `upskirt` 0.42, `thighs` 0.27,
  # `ass` 0.24, `underwear` 0.25, `panties` 0.23, `bare_legs` 0.23,
  # `cleavage_cutout` 0.06. A floor of 0.60 removed the entire category, and
  # the cap of 20 filled up with hair colours before it ever got near them.
  #
  # There is no facet lane to reserve instead. web/appearance.js classifies
  # `princess_carry`, `upskirt`, `panties` and `ass` all as `appearance` — it
  # was built to answer "does this describe the character", and `action` holds
  # exactly two tags on this picture. A vocabulary that names the category
  # would be a new list and is not one to invent unreviewed.
  #
  # So: a low floor and a wide cap, on the arm that is being tested. 0.20
  # reaches the whole anatomy tail; 45 is enough slots that hair colours
  # cannot crowd it out.
  # The broad list — every tag above the floor, best first — is OFF. The
  # owner's call once the reserved lane existed: "how can we inject just those
  # then". He is right, and it is the same lesson as the prompt file: the
  # analyst is already looking at the picture, so forty tags about hair colour
  # and boots are forty tags it did not need. Only the category it will not
  # describe by itself earns the room.
  #
  # Turn it on and both lanes go. The floor and cap below apply to it alone.
  reference_tag_hint_broad: false
  reference_tag_hint_threshold: 0.20
  reference_tag_hint_max: 45

  # ── The reserved lane ────────────────────────────────────────────────────
  #
  # Confidence ranking alone cannot surface the blind spot, and this is
  # measured rather than assumed. On the 136-tag run, with the floor at 0.20
  # and FORTY-FIVE slots, the list still cut `panties`, `underwear`, `ass`,
  # `thighs` and `bare_legs` — because a booru tagger is simply more certain
  # about hair colour than about anatomy, and 45 slots fill with
  # `multicolored_hair`, `bright_pupils` and `armlet` first. No threshold
  # fixes that; the category has to be named.
  #
  # web/appearance.js cannot name it either: it files `princess_carry`,
  # `upskirt`, `panties` and `ass` all under `appearance`, because it was
  # built to answer "does this describe the character".
  #
  # So these patterns get their own slots at their own floor, on top of the
  # confidence list above. Matched against the danbooru tag with underscores,
  # case-insensitively, as substrings — `breast` catches `breasts`,
  # `small_breasts`, `breasts_apart`.
  #
  # **This list is the owner's.** It is a vocabulary for what counts as the
  # part the vision model will not describe, which is a judgement about the
  # work, not about the code. Drafted from what animetimm actually returned
  # plus ordinary danbooru anatomy and position vocabulary; add and remove
  # freely, no code change.
  # Subtracted from the matches above. Every entry here was found by running
  # the vocabulary over all 90,857 danbooru tags — see
  # `node archive/scripts/audit-reference-vocab.mjs`, which prints what each pattern
  # claims. None of these were imaginable at a desk; `feet_out_of_frame` in
  # particular means the feet are NOT in shot, which is the opposite of the
  # thing being asked for.
  #
  # A separate list rather than a cleverer include list, so that excluding
  # `transparent_background` does not require knowing that the word
  # `transparent` is what let it in. Matched exactly as the include list is:
  # a bare word matches a whole word, a pattern with an underscore is a
  # substring.
  #
  # **Re-run the audit after editing either list.** Both mistakes fixed today
  # were found by looking at real output, not by thinking about it.
  reference_tag_hint_excluded:
