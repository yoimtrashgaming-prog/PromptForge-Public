models:

  # ─────────────────────────── IMAGE ───────────────────────────

  illustrious:
    name: "Illustrious"
    label: "Illustrious XL"
    type: "image"
    template: "booru"
    badge: "booru"
    format_label: "Booru tag format"
    gen_button: "Generate prompt"
    system_prompt: "prompts/image/illustrious-min-ex.md"
    # One file per segment, appended to the system prompt only when that
    # segment is actually being asked for. The owner's design, 5 Sep 2026.
    #
    # It replaces telling the model to write a segment and then telling it not
    # to. The base file above is now only how this model THINKS - its
    # vocabulary, its tag order, and the one worked brief every block writes
    # against. What to emit lives per segment, so nothing is overridden and
    # nothing contradicts.
    #
    # Two things fall out that were not the point but are worth having. Each
    # segment is one file to open when that segment misbehaves - his argument,
    # and the better one: "if neg isnt working we look at neg". And because
    # the blocks are APPENDED, the base prompt stays byte-identical for
    # everyone, so the prefix cache is still shared and only the tail differs.
    segment_blocks:
      "Positive prompt": "prompts/image/segments/illustrious-positive.md"
      "Negative prompt": "prompts/image/segments/illustrious-negative.md"
      "Reasoning": "prompts/image/segments/illustrious-reasoning.md"
    thinking: false
    segments: ["Positive prompt", "Negative prompt", "Reasoning"]
    # Segments that explain the prompt rather than being part of it. Copy all
    # leaves these out, because what it produces goes into a prompt box — for
    # h3 that box is the DaSiWa Director, which assembles a base-mode prompt
    # from three official fields and has no use for a paragraph of the model
    # explaining itself. Download still writes everything.
    meta_segments: ["Reasoning"]
    # Spaces, not underscores, from 3 Oct 2026 (owner: underscores "have more
    # or less been trained out of the model"). Selects the danbooru space list,
    # as anima does; the ladders and negative below are spelled to match.
    tag_style: "space"
    # Offers the search_tags tool when tools.enabled is on and the LLM
    # reports the capability. Booru dialects only: a tag search is worth a
    # round trip when the output IS tags, and worth nothing to a prose model.
    tools: true
    weight_range: { min: 0.5, max: 1.8, step: 0.05, default: 1.0 }
    # Ladder verbatim from prompts/image/illustrious.md — that file says
    # "the registry provides" these, so this is the authoritative copy.
    quality_presets:
      masterpiece:  ["masterpiece", "best quality", "absurdres"]
      high_quality: ["best quality", "highres"]
      standard:     ["best quality"]
      # Added 27 Aug 2026 with the "nothing preselected" change. An empty
      # list means the quality block is simply absent, which is a legitimate
      # thing to want and was already offered on sdxl.
      none:         []
    default_quality_preset: "none"
    negative_defaults: "worst quality, low quality, normal quality, lowres, bad anatomy, bad hands, extra fingers, fewer fingers, blurry, watermark, text, signature"
    # Render from PromptForge (docs/render-plan.md; off unless comfyui.enabled).
    # `workflow` is ComfyUI's Export (API) file, the one that runs;
    # `ui_workflow` is the normal save of the same graph, written into the PNG
    # so the picture reopens in ComfyUI. Presets fill the sampler settings in
    # one click; the first is the workflow's own. `model_file` swaps the file
    # in the workflow's model loader.
    render:
      workflow: "config/comfyui/illustrious.json"
      ui_workflow: "config/comfyui/ui/illustrious.json"
      presets:
        - { name: "Illustrious · 30 steps · CFG 4.5", steps: 30, cfg: 4.5, sampler: "dpmpp_2m_sde", scheduler: "karras" }
      # Which LoRAs are for this model, by what the LoRA file says it was
      # trained on (its modelspec.architecture / base model). Any match counts.
      # TrainFlow's SDXL LoRAs say "stable-diffusion-xl-v1-base/lora". The
      # owner can override per LoRA in the app.
      lora_match: ["stable-diffusion-xl", "sdxl", "illustrious"]



  anima:
    name: "Anima"
    label: "Anima"
    type: "image"
    template: "hybrid"
    badge: "hybrid"
    format_label: "Hybrid — tags + natural language"
    gen_button: "Generate prompt"
    # v2, 4 Sep 2026: a user's two-pass method folded in - describe the picture
    # in prose first, then map only what is in that description to tags. His
    # skill is the better prior on Anima, and the two rules that come with the
    # method (the prompt may not contain what the draft does not, and may not
    # broaden it) are the ones that stop tag vocabulary deciding what the image
    # is. Everything anima-min.md already said is carried over verbatim -
    # 18 of its 19 blocks byte-for-byte, the exception being the example's
    # Reasoning line, which now has to demonstrate the pass.
    #
    # ROLLBACK: point this back at "prompts/image/anima-min.md", which is
    # untouched. anima-min-v1-backup.md is a byte copy of it taken before any
    # of this, in case that file is ever edited by mistake.
    system_prompt: "prompts/image/anima-min-v2.md"
    # One file per switchable segment, appended only when it is asked for.
    # The base file above is how this model THINKS; these are what each
    # segment is. See the note on illustrious for the whole argument.
    segment_blocks:
      "Negative prompt": "prompts/image/segments/anima-negative.md"
      "Reasoning": "prompts/image/segments/anima-reasoning.md"
    # The vendor's own guide, loaded ahead of anima.md the same way h3 loads
    # its official MiniMax docs. Added 30 Aug 2026 after the owner asked
    # whether one existed — it does, and anima.md turned out to agree with it
    # on every point of format, which is worth being able to re-verify rather
    # than take on trust.
    #
    # Composition puts references BEFORE the model's own file, so anima.md
    # still gets the last word on anything the two frame differently.
    #
    # Committed rather than fetched at setup, unlike h3's: this is a short
    # digest written here, not a copy of a third-party document.
    reference_files: ["prompts/image/references/anima-official.md"]

    # A user's skill documents, readable on demand rather than loaded.
    #
    # His package is 54,000 characters and works on his machine because a Codex
    # skill discloses progressively: the description sits in context, the
    # method loads on trigger, a reference loads only when opened.
    # visual-direction-tags.md is 26 KB precisely because nobody reads all of
    # it. Flattened into this prompt it would take anima from ~2,545 tokens to
    # ~13,300 on every generation, most of it unread.
    #
    # So the model opens them itself, through read_guidance - see
    # server/guidance.mjs. What sits in context is the index below: one line
    # per document, which is what the model reads to decide whether opening it
    # is worth a round trip. Those lines are the whole interface, so they have
    # to be honest about what is inside; a wrong one costs a pass and returns
    # something useless.
    #
    # NOT every Qwen on the box can call a tool. OBLITERATED cannot, and the
    # gate in toolsFor() means it simply gets none. anima-min.md must therefore
    # carry the METHOD and name these only as depth - a prompt that needs a
    # document to function would be broken on that model and fine on the other
    # four, which is the worst way for this to fail.
    guidance:
      anima-model:
        path: "prompts/image/references/anima-skill/references/anima-prompting.md"
        about: "Anima model profiles, prompt syntax and tag ordering, negative baselines, samplers, resolutions and CFG"
      # A user's own compact rewrite, sent 4 Sep 2026 with the note that it is
      # "simplified visual tags for qwen". It opens by saying what it is for:
      # when the full catalogue cannot fit in the local model's context. That
      # is our case - visual-direction-tags.md is 26 KB against this one's
      # 6.6 KB, and a document the model declines to open is worth nothing.
      #
      # The full catalogue stays on disk, unreferenced. Listing both would put
      # two lines in the index covering the same ground, and the index is the
      # whole interface: the model picks from those lines alone and would have
      # no way to tell which of the two it wanted.
      visual-direction:
        path: "prompts/image/references/anima-skill/references/visual-direction-compact.md"
        about: "the two vocabularies - which camera, composition, focus, lighting, palette, atmosphere, material and finish terms are real booru tags, and which are English text modifiers Anima's encoder reads but Danbooru has never heard of"
      showcase-patterns:
        path: "prompts/image/references/anima-skill/references/civitai-showcase-patterns.md"
        about: "patterns from Civitai's official Anima showcase: multi-character scenes, literal tag disambiguators, environment-only images, and the aesthetic score-tag discrepancy"
      layout-binding:
        path: "prompts/image/references/anima-skill/references/layout-and-binding.md"
        about: "panels, grids, comics, collages, fixed regions, binding a named character to a position, and no-crop requirements"
    thinking: false
    segments: ["Positive prompt", "Negative prompt", "Reasoning"]
    meta_segments: ["Reasoning"]
    tag_style: "space"
    # Offers the search_tags tool when tools.enabled is on and the LLM
    # reports the capability. Booru dialects only: a tag search is worth a
    # round trip when the output IS tags, and worth nothing to a prose model.
    tools: true
    # Anima weights differently from the SDXL family, and the ceiling reflects
    # it. 1.8 was the CLIP-ish range every other model here uses; Anima's own
    # author reaches for (chibi:2), a user reports going to 5 on a stubborn
    # concept, and 1.8 made both unreachable from the slider. Raised 27 Aug
    # 2026 - see anima.md "Weighting", which says start unweighted and add one
    # strong weight rather than many timid ones.
    weight_range: { min: 0.5, max: 5.0, step: 0.05, default: 1.0 }
    # Masterpiece rewritten 22 Aug 2026 to the owner's own ladder - what they
    # actually use on Anima, which mixes the aesthetic vocabulary with the
    # Pony-style score tags this checkpoint also answers to.
    quality_presets:
      # Trimmed to the official four on 30 Aug 2026, on the owner's call, after
      # reading circlestone-labs' own model card — see
      # prompts/image/references/anima-official.md. Its recommended positive
      # prefix is exactly "masterpiece, best quality, score_7, safe, ".
      #
      # It used to be twelve: the whole human ladder AND the whole score
      # ladder, plus absurdres, newest and highres. anima.md says the two
      # quality systems are independent and you may use "either, both, or
      # neither"; this used both, maximally, and put twelve tags in front of
      # every Masterpiece prompt before a word of content. Measured on a
      # Frieren brief the same day, that was a third of the tag section.
      #
      # `safe` is NOT here even though the official prefix includes it. It is a
      # rating rather than a quality level, house-rules.md already defaults it
      # to the safe variant, and baking it into a quality preset would make the
      # rating impossible to change without changing the quality.
      masterpiece:  ["masterpiece", "best quality", "score_7"]
      # The card's own second rung. Aesthetic-only, because the human ladder
      # and the score ladder saying different things is what the big preset did.
      high_quality: ["best quality", "score_7"]
      standard:     ["best quality"]
      # Added 27 Aug 2026 with the "nothing preselected" change. An empty
      # list means the quality block is simply absent, which is a legitimate
      # thing to want and was already offered on sdxl.
      none:         []
    default_quality_preset: "none"
    # A style is a LIST OF TAGS, on the same rule as quality_presets above.
    #
    # It was a list of bare labels until 3 Sep 2026, and that was the identical
    # bug fixed for quality presets on 27 Aug: only the NAME reached the model,
    # so "Style: Painterly" arrived and the model wrote whatever it remembered
    # painterly meaning. Reported by a user as "the style prompts weren't
    # working", and this is the whole of it — the control fired, it just
    # carried no payload.
    #
    # The tags come from a user's Anima Visual Tags Catalogue (verified against
    # circlestone-labs' model card and the Danbooru tag-count dataset, 2 Sep
