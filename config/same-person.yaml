# Tags danbooru keeps separate that name ONE character.
#
# Its own file, not a block in server.yaml, for two reasons. It is data
# rather than tuning — a list that grows one franchise at a time and wants
# to be picked up and put down — and server.yaml is the file two machines
# keep editing at once, which has already cost one block of somebody's work.
#
# Read by server/traits.mjs, which merges anything here with whatever
# config/server.yaml also declares. A machine-local config/same-person.local.yaml
# wins over this file, the same as every other config in this project.
#
# WHY IT EXISTS. A character who is never drawn alone gets described by
# whoever stands next to them, so the trait lookup subtracts the co-star's
# own traits. That is right for a companion and catastrophic for a second
# name: subtract Scaramouche from Wanderer and you delete his face. Nothing
# in the data can tell the two apart — co-tag share was measured and does
# not separate them, Oz sits with Fischl in 97% of his posts while Rex Lapis
# sits with Zhongli in 72% — so they are declared here instead.
#
# HOW TO ADD ONE. Find the character's page on danbooru and read the first
# line. "An alternate version of X", "X's playable incarnation", "the real
# human form of X" means the same character: add it. "X's pet", "X's
# familiar", "the younger brother of X" means a companion: leave it out.
# Listing a pair wrongly only costs a subtraction, so err toward listing.
#
# Matched on the name before the opening parenthesis, so one line covers every
# costume of every name in the group.

# `<name>_<suffix>` is the same character as `<name>`. The list below says
# the same thing one pair at a time; this says it as a rule, for franchises
# that name their alternate forms regularly.
#
# Kancolle is why it exists. Every shipgirl's remodel is `<ship>_kai`,
# `_kai_ni` or `_kai_san`, and a remodel is the same girl in an upgraded
# outfit — danbooru puts it plainly: "the second remodel of Shigure",
# "Musashi's kai form". Measured 16 Sep 2026 that is 104 groups over 212
# tags among ships with 150+ posts, which as a list would be 104 lines all
# restating one rule. The foreign-language remodels (Верный/dva, Roma due,
# Littorio nuovo, Gangut andra) are the same convention in another language.
#
# A whitelist, never a general "starts with" test: a name that merely begins
# with another name is usually somebody else. `kumano_maru` is an amphibious
# assault ship, `kumano` a heavy cruiser, and `maru` is deliberately absent.
same_person_suffixes:
  ["kai", "kai_ni", "kai_san", "kai_ni_go", "ni", "mk_ii",
   "dva", "due", "nuovo", "andra", "agb",
   "alter"]

# The same rule at the other end of the name, for franchises that put the form
# first. Every Pokemon Mega evolution is `mega_<species>`, and danbooru applies
# both tags to every post — measured 16 Sep 2026 all 20 had ZERO posts without
# the species tag, so all 20 were having their own species subtracted from them.
# Mega Lucario came back as `mega_pokemon, pokemon_focus`, his blue fur, spikes
# and aura gone; Primal Groudon as `orange_eyes`.
#
# Regional variants are deliberately NOT here. `alolan_vulpix` has 210 solo
# posts and never reaches this path at all, and it is white where Vulpix is red
# — for those, subtracting the base is the right answer rather than the wrong
# one. Only forms that keep the base design belong in this list.
#
# `female` and `male` are the selectable-gender player avatar, which every game
# that has one tags the same way. Measured 16 Sep 2026, all 25 pairs with a
# neutral base tag were exactly that: Kancolle's admiral, Arknights' Doctor and
# Endministrator, Blue Archive's Sensei, Wuthering Waves' Rover, Azur Lane's
# Commander, Umamusume's Trainer, Touken Ranbu's saniwa, Girls' Frontline's
# Commander. Fire Emblem deleted the neutral tag for its avatars, so Byleth,
# Corrin, Robin, Alear and Shez exist only as the two gendered tags — the
# matcher strips the marker from BOTH names, which is what lets `female_byleth`
# and `male_byleth` find each other.
same_person_prefixes: ["mega", "primal", "gigantamax", "female", "male"]

# Tags danbooru keeps separate that name ONE character. Nothing in the data
# can find these — co-tag share was measured and does not separate them, as
# Oz sits with Fischl in 97% of his posts while Rex Lapis sits with Zhongli
# in 72% — so they are declared. Without the list, subtraction strips a
# character's own face: Wanderer is 15,103 posts of Scaramouche.
#
# Matched on the name before `_(`, so one line covers every costume of every
# name in the group. Listing a pair wrongly only means subtracting less, so
# err toward listing. Evidence for each of these is danbooru's own wiki:
# Wanderer is "Scaramouche's playable incarnation", Peruere "the younger
# identity of Arlecchino", Cloud Retainer "playable under her human form,
# Xianyun", and Rex Lapis's page says not to tag Zhongli with it "if only his
# human form is present".
#
# Only the franchises this group uses are curated. An uncurated one behaves
# as it did before — see the note in server/traits.mjs.
# A character-table row that describes somebody else as well, where the live
# sample does not. Not the same fault as the list below: nothing is being
# subtracted from itself, the table simply averaged two characters together.
# Ainz Ooal Gown's noob-wiki row is "1girl, demon girl, demon horns, yellow
# eyes, red eyes, hair between eyes, black hair, long hair, large breasts,
# black wings, skeleton" — Albedo, drawn beside him so often the list took her
# for him. His live sample is his alone and right, so without this the merge
# appended her wings, horns and breasts under his skeleton.
#
# Each character names whose look to remove from THEIR table row: the other
# character's live traits and table row both come out, except anything this
# character's own live sample carries. Only the table row is touched.
table_contaminants:
  ainz_ooal_gown: ["albedo_(overlord)"]
  # 18 Sep 2026, found by reading the canon sent for 129 characters. Pikachu's
  # row was Ash's black hair and red cap; Sam's was Firefly's grey hair and
  # ribbons — Sam is the mech, so what Firefly looks like is not his.
  pikachu: ["ash_ketchum"]
  "sam_(honkai:_star_rail)": ["firefly_(honkai:_star_rail)"]

# A row that is not one other character but everybody the character is drawn
# with, so there is nobody to name above. Sensei's row is "1girl, long black
# hair, very long hair, large breasts, halo" — the students — for a player
# avatar who is usually a faceless man; the Umamusume Trainer's is horse ears
# and a horse tail on a human. These never read the table: what their own
# posts say is all they get, and the prompt says not to invent the rest.
table_skip:
  - "sensei_(blue_archive)"
  - "doodle_sensei_(blue_archive)"
  - "trainer_(umamusume)"

# Hand corrections, for what no rule above can reach: tags taken off one
# character whatever the lookup finds, in the prompt and the traits panel
# alike. Last resort — every entry is a character the automatic path gets
# wrong in a way we could see and could not fix. Added 18 Sep 2026:
#   - Doodle Sensei is never drawn alone; his own posts are group shots with
#     students, so their halo, blue eyes and long hair came back as his.
#   - The Umamusume Trainer is a human drawn among horse girls.
#   - 2B's canon is the blindfold; `no_blindfold` is how some posts show her.
#   - Numby (Star Rail) is Topaz's Warp Trotter, a small golden pig; every
#     trait that came back was Topaz's. Clockie is the Dreamjolt Troupe's
#     clock-headed mascot and came back as a grey-haired girl. Neither has a
#     true trait in either source, so both are emptied and get the
#     do-not-invent line. The subtraction could not do it: it only removes a
#     companion's RANKED traits, and the leftovers were still hers.
trait_remove:
  "doodle_sensei_(blue_archive)": ["halo", "blue_eyes", "long_hair", "very_long_hair", "large_breasts"]
  "trainer_(umamusume)": ["horse_girl", "horse_ears", "horse_tail", "animal_ears", "tail"]
  "2b_(nier:automata)": ["no_blindfold"]
  "numby_(honkai:_star_rail)": ["purple_eyes", "blonde_hair", "hair_ornament", "large_breasts",
    "medium_breasts", "hair_between_eyes", "two-tone_hair", "streaked_hair", "red_hair", "long_hair",
    "short_hair", "blue_eyes"]
  "clockie_(honkai:_star_rail)": ["purple_eyes", "hair_between_eyes", "hair_over_one_eye", "grey_hair",
    "long_hair", "ponytail", "yellow_eyes", "short_hair", "black_hair"]
  # Gojou Wakana (Dress-Up Darling) is a boy with short black hair. Marin is
  # subtracted from his mixed sample, but only her ranked traits, so her
  # chest, gradient hair and nails were left behind as his. 19 Sep 2026.
  "gojou_wakana": ["large_breasts", "medium_breasts", "multicolored_hair", "gradient_hair",
    "nail_polish", "long_fingernails", "blonde_hair", "long_hair"]
  # GATE, 19 Sep 2026. Lelei is a human mage and Itami a human soldier, but
  # both carried Tuka's elf ears out of the group shots the three share. Yao's
  # 37 posts are mostly the JSDF convoy, and two gun models came back as hers.
  "lelei_la_lalena": ["elf", "pointy_ears", "long_pointy_ears"]
  "itami_youji": ["elf", "pointy_ears", "long_pointy_ears", "howa_type_64"]
  "yao_haa_dushi": ["fn_mag", "browning_m2"]
  # Arcane's alternate-timeline Powder is drawn with Ekko nearly every time, and
  # came back as him: dreadlocks, dark skin, male. Her own blue hair, blue eyes
  # and short hair stay. 19 Sep 2026.
  "powder_(alternate_timeline)_(arcane)": ["dreadlocks", "dark-skinned_male", "dark_skin", "earrings",
    "male_focus", "1boy"]
  # Blue Archive, 19 Sep 2026. Peroro is Hifumi's mascot bird and is drawn in
  # her arms; her hair, eyes and halo came back as his. Mari is a cat girl and
  # her track costume's posts are tagged `fox_ears` often enough to rank.
  "peroro_(blue_archive)": ["halo", "yellow_halo", "long_hair", "twintails", "low_twintails",
    "yellow_eyes", "hair_between_eyes"]
  "mari_(track)_(blue_archive)": ["fox_ears"]

