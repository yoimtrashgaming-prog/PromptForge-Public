  # Jujutsu Kaisen, Naruto, One Piece, Dragon Ball, Chainsaw Man, JoJo, Bleach
  # and Frieren, 18 Sep 2026. Eight sweeps (failed=0), 28 pairs A/B'd, 13 kept.
  #
  # A possessed body keeps its face, so the possession is grouped with the
  # body's owner: Sukuna's second possession is "Sukuna as depicted after he
  # possesses Megumi" (ungrouped he was white-haired; grouped, Megumi's black
  # spiked hair under the tattoos). The Gun Fiend is "the form the Gun Devil
  # takes after possessing the body of Hayakawa Aki" (grouped he gets Aki's
  # suit and hair back; ungrouped he was only guns). The War Devil tag is
  # mostly Yoru in Asa's body, and ungrouped came back as `bird, owl`; grouped,
  # the ringed eyes, cross scar and uniform. Yoru and Asa share that body, so
  # they are one group. Kawajiri Kosaku is the face Kira "subsequently adopts";
  # grouped he gains the suit and loses a stray `stand_(jojo)`.
  #
  # A secret identity or alternate form: Tobi is Obito "for all of his masked
  # appearances" (ungrouped, Naruto's blonde hair; grouped, black hair and
  # sharingan, mask kept). Death Devil "is revealed to be Fami" (ungrouped only
  # `medium_hair, red_eyes`). Chainsaw Man is "Denji's hybrid devil form"
  # (gains his shirt and tie). Demonio Fleur is "an alternate form of Nico
  # Robin". Unohana Yachiru is "the original bloodthirsty persona of Unohana
  # Retsu" (gains her haori and long black hair).
  #
  # Genderswaps, as with Vocaloid: Law-chan gains Law's hat, tattoos and yellow
  # eyes; Luffyko gains the straw hat and the scar. Both lose only the labels.
  #
  # Orange Piccolo breaks the recolour rule on measurement: grouped he KEEPS
  # `orange_skin` and gains the antennae, pointy ears and bald head he was
  # missing. Super Shadow (Sonic, a stray from the Dragon Ball roster) gains
  # his red stripes and red eyes.
  #
  # Left OUT, measured. Majin Vegeta loses `majin_symbol`, the M on his
  # forehead. The Bomb Hybrid loses `object_head` and `explosive`, the bomb
  # head that is the whole design. Haruno Shiobana (child Giorno) loses
  # `child, bowl_cut`. Majin Android 21 trades her tube top and pants for
  # earrings: no gain. Beast Gohan and Great Saiyaman lose the purple gi and
  # the sunglasses. No effect either way: Kenjaku (Geto's body is already
  # `geto_suguru_(kenjaku)`, the same name part), Perfect Cell, every Frieza,
  # Cooler and Buu form, Fused Zamasu — their samples are never mixed.
  # Stands, familiars, Kurama, Gyokuken and Rika are companions. Frieren
  # needs nothing.
